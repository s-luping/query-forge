# 开发纲领 §2：pre-commit — 提交前自动过 lint / 守卫
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: local
    hooks:
      - id: ci-guard
        name: ci-guard (纲领 §6.3 反模式守卫)
        entry: python scripts/ci_guard.py
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
