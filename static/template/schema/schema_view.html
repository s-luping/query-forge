<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库 查看</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
<div class="container-fluid">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>数据库 列表</span>
            <div class="d-flex align-items-center gap-2">
                <button class="btn btn-sm btn-outline-danger" id="btnDelSchema" onclick="deleteSelectedSchema()" data-admin-only title="删除筛选器中选中的库（含表/字段）">
                    <i class="fas fa-trash-alt"></i> 删除选中库
                </button>
                <button class="btn btn-sm btn-outline-danger" id="btnDelTable" onclick="deleteSelectedTable()" data-admin-only title="删除筛选器中选中的表（含字段）">
                    <i class="fas fa-trash-alt"></i> 删除选中表
                </button>
                <button class="btn btn-sm btn-outline-primary" onclick="downloadCsvTemplate()" title="下载标准 CSV 模板">
                    <i class="fas fa-download"></i> 模板下载
                </button>
                <button class="btn btn-sm btn-primary" id="btnCsvUpload" onclick="openCsvUpload()" data-admin-only title="按模板导入 CSV（仅管理员）">
                    <i class="fas fa-upload"></i> CSV 上传
                </button>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadSchemaList()">
                    <i class="fas fa-sync"></i> 刷新
                </button>
            </div>
        </div>
        <div class="filter-section">
            <div class="row">
                <div class="col-md-2">
                    <label class="form-label">数据源:</label>
                    <select class="form-select" id="filterDatasource" onchange="onDatasourceChange()">
                        <option value="">全部数据源</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">数据库:</label>
                    <select class="form-select" id="filterSchema" onchange="onSchemaChange()">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label">表名:</label>
                    <select class="form-select" id="filterTable" onchange="onTableChange()" disabled>
                        <option value="">请先选择数据库</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">搜索:</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="库、表、字段...">
                </div>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-sm mb-0">
                    <thead>
                        <tr>
                            <th>数据库</th>
                            <th>表名</th>
                            <th>字段名</th>
                            <th>字段类型</th>
                            <th>字段描述</th>
                            <th>表描述</th>
                            <th>主键</th>
                            <th>外键</th>
                            <th>维度</th>
                            <th>度量</th>
                            <th>创建时间</th>
                            <th id="thOps" style="display:none;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="schemaTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" id="paginationContainer">
            <span id="paginationInfo" style="font-size:13px;">共 0 条</span>
            <div>
                <button class="btn btn-sm btn-outline-secondary me-2" id="prevPageBtn" onclick="prevPage()" disabled>
                    <i class="fas fa-chevron-left"></i> 上一页
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="nextPageBtn" onclick="nextPage()" disabled>
                    下一页 <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>
</div>
<!-- CSV 上传弹窗（仅管理员可见按钮；接口本身强制管理员 + 大小/格式校验） -->
<div class="modal fade" id="csvUploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">CSV 导入</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-info py-2" style="font-size:12px;">
                    请先点「模板下载」获取标准格式后填写再上传；仅支持 <b>.csv</b> 文件（≤5MB），
                    表头必须包含 <b>表名</b>、<b>字段名</b>。导入的库将关联到所选数据源。
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1">数据源 <span class="text-danger">*</span></label>
                    <select id="csvDatasource" class="form-select form-select-sm" onchange="onCsvDatasourceChange()">
                        <option value="">请选择数据源</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1">数据库类型 <span class="text-danger">*</span> <small class="text-muted">(选择数据源后自动带出，可改)</small></label>
                    <select id="csvDbType" class="form-select form-select-sm">
                        <option value="mysql" selected>MySQL / MariaDB</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="oracle">Oracle</option>
                        <option value="sqlserver">SQL Server</option>
                        <option value="sqlite">SQLite</option>
                        <option value="hive">Hive</option>
                        <option value="doris">Doris</option>
                        <option value="clickhouse">ClickHouse</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1">默认数据库名称 <small class="text-muted">(可选，CSV 行内 schema_name 为空时使用)</small></label>
                    <input type="text" id="csvSchemaName" class="form-control form-control-sm" placeholder="留空使用 default">
                </div>
                <div class="mb-2">
                    <label class="form-label mb-1">选择 CSV 文件 <span class="text-danger">*</span></label>
                    <input type="file" id="csvFile" class="form-control form-control-sm" accept=".csv">
                </div>
                <div id="csvUploadMsg" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" id="csvUploadBtn" onclick="uploadCsvFile()">上传导入</button>
            </div>
        </div>
    </div>
</div>

<link rel="stylesheet" href="/static/css/all.min.css">
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script src="/static/js/schema_view.js"></script>
</body>
</html>
