<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schema 查看</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6fa; font-size: 14px; }
        .container-fluid { padding: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card-header { background: white; border-bottom: 1px solid #eee; font-weight: 600; padding: 12px 20px; border-radius: 12px 12px 0 0 !important; }
        table { font-size: 13px; }
        table th { background: #f8f9fa; white-space: nowrap; }
        .badge-type { font-size: 11px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Schema 列表</span>
            <div>
                <select class="form-select form-select-sm d-inline-block" style="width:180px;" id="schemaFilter" onchange="loadSchemas()">
                    <option value="">全部 Schema</option>
                </select>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Schema</th><th>表名</th><th>字段名</th><th>类型</th><th>描述</th><th>键</th></tr></thead>
                    <tbody id="schemaTable"><tr><td colspan="6" class="text-center py-4 text-muted">加载中...</td></tr></tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
            <span class="text-muted" style="font-size:13px;">共 <span id="totalCount">0</span> 条</span>
            <nav><ul class="pagination pagination-sm mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>
<link rel="stylesheet" href="/static/css/all.min.css">
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
const apiRequest = window.apiRequest || function(url, options = {}) {
    const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return fetch(url, { ...options, headers }).then(resp => {
        if (resp.status === 401) { window.parent.location.href = '/login'; throw new Error('登录已过期'); }
        return resp;
    });
};

let page = 1, pageSize = 30;

async function loadSchemas() {
    const name = document.getElementById('schemaFilter').value;
    let url = `/api/schema/list?limit=${pageSize}&offset=${(page-1)*pageSize}`;
    if (name) url += `&schema_name=${encodeURIComponent(name)}`;
    try {
        const resp = await apiRequest(url);
        const data = await resp.json();
        document.getElementById('totalCount').textContent = data.total;
        const tbody = document.getElementById('schemaTable');
        if (!data.items.length) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">暂无数据</td></tr>';
            document.getElementById('pagination').innerHTML = '';
            return;
        }
        tbody.innerHTML = data.items.map(s => `
            <tr>
                <td><span class="badge bg-info">${e(s.schema_name)}</span></td>
                <td><strong>${e(s.table_name)}</strong>${s.table_description ? `<br><small class="text-muted">${e(s.table_description)}</small>` : ''}</td>
                <td>${e(s.column_name)}</td>
                <td><span class="badge-type bg-light text-dark">${e(s.column_type)}</span></td>
                <td><small>${e(s.column_description||'-')}</small></td>
                <td>${s.column_key ? `<span class="badge bg-warning text-dark">${s.column_key}</span>` : '-'}</td>
            </tr>`).join('');
        // 分页
        const totalPages = Math.ceil(data.total / pageSize);
        let html = '';
        if (page > 1) html += `<li class="page-item"><a class="page-link" href="#" onclick="goPage(${page-1})">上一页</a></li>`;
        for (let i = 1; i <= Math.min(totalPages, 5); i++) {
            html += `<li class="page-item ${i===page?'active':''}"><a class="page-link" href="#" onclick="goPage(${i})">${i}</a></li>`;
        }
        if (totalPages > 5) html += `<li class="page-item disabled"><span class="page-link">...</span></li><li class="page-item"><a class="page-link" href="#" onclick="goPage(${totalPages})">${totalPages}</a></li>`;
        if (page < totalPages) html += `<li class="page-item"><a class="page-link" href="#" onclick="goPage(${page+1})">下一页</a></li>`;
        document.getElementById('pagination').innerHTML = html;
    } catch(e) { console.error(e); }
}

async function loadSchemaNames() {
    try {
        const resp = await apiRequest('/api/schema/schemas');
        const data = await resp.json();
        const sel = document.getElementById('schemaFilter');
        data.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sel.appendChild(o); });
    } catch(e) {}
}

function goPage(p) { page = p; loadSchemas(); }
function e(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }

document.addEventListener('DOMContentLoaded', () => { loadSchemaNames(); loadSchemas(); });
</script>
</body>
</html>
