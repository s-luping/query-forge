<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>QueryForge 智能数据查询平台 - 登录</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/img/logo.svg">
    <link rel="stylesheet" href="/static/css/login.css">
    <style>
        .form-container {
            display: none;
        }
        .form-container.active {
            display: block;
        }
        .success-message {
            display: none;
            color: #4CAF50;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>

<body class="tpl-login-root">
    <div class="login-container">
        <div class="login-brand">
            <img src="/static/img/logo.svg" width="48" height="48" alt="QueryForge" data-brand-logo>
            <div class="login-brand-name" data-brand-name>QueryForge</div>
            <div class="login-brand-sub">智能数据查询平台</div>
        </div>
        <div class="login-title">用户登录</div>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>

        <!-- 登录表单（内部系统不开放注册，账号由管理员在用户管理中创建） -->
        <div id="loginFormContainer" class="form-container active">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>
        </div>
        <div class="login-footer">内部系统 · 账号由管理员统一分配</div>
    </div>
    <script src="/static/js/branding.js"></script>
    <script>
        // 为用户名输入框添加Enter键监听
        document.getElementById('username').addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                const password = document.getElementById('password');
                if (this.value.trim() !== '') {
                    password.focus();
                } else {
                    submitLoginForm();
                }
            }
        });

        // 为密码输入框添加Enter键监听
        document.getElementById('password').addEventListener('keydown', function (event) {
            if (event.key === 'Enter' && this.value.trim() !== '') {
                submitLoginForm();
            }
        });

        function submitLoginForm() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (username && password) {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        }

        // 登录表单提交
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                const data = await response.json();
                if (response.ok && data.username) {
                    // token 已由服务端以 HttpOnly cookie 下发（JS 不可读，防 XSS 窃取）
                    // 跳转到主界面
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.detail || '登录失败，请检查用户名和密码';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.style.display = 'block';
            }
        });

        // 辅助函数：从cookie中获取指定名称的值
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
</body>

</html>
