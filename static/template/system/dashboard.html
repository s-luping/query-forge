<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/all.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body { background: #f5f6fa; }
        .stat-card { border-radius: 12px; padding: 20px; color: white; text-align: center; transition: transform .15s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card .stat-value { font-size: 30px; font-weight: 700; }
        .stat-card .stat-label { font-size: 13px; opacity: .9; margin-top: 4px; }
        .stat-card .stat-icon { font-size: 20px; margin-bottom: 6px; opacity: .85; }
        .bg-purple { background: linear-gradient(135deg, #667eea, #764ba2); }
        .bg-blue { background: linear-gradient(135deg, #2196f3, #1e88e5); }
        .bg-green { background: linear-gradient(135deg, #2d6a4f, #40916c); }
        .bg-orange { background: linear-gradient(135deg, #ffb703, #fb8500); }
        .bg-red { background: linear-gradient(135deg, #f5365c, #f56036); }
        .bg-teal { background: linear-gradient(135deg, #006d77, #83c5be); }
        .bg-gray { background: linear-gradient(135deg, #6c757d, #adb5bd); }
        .section-card { background: #fff; border-radius: 10px; border: 1px solid #e9ecef; margin-bottom: 16px; }
        .section-card .card-header { background: #fafbfc; border-bottom: 1px solid #eef0f2; font-weight: 600; font-size: 14px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; }
        .section-card .card-body { padding: 0; }
        .quick-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; color: #495057; font-size: 13px; cursor: pointer; transition: all .15s; }
        .quick-link:hover { background: #e7f1ff; border-color: #0d6efd; color: #0d6efd; text-decoration: none; }
        .quick-link i { font-size: 12px; }
        .badge-success { background: #40916c; }
        .badge-failed { background: #f5365c; }
        .badge-running { background: #2196f3; }
        .badge-pending { background: #ffb703; color: #333; }
        .empty-state { text-align: center; padding: 30px; color: #999; font-size: 13px; }
        .table th { font-size: 12px; color: #888; font-weight: 600; background: #fafbfc; }
        .table td { font-size: 13px; vertical-align: middle; }
        .greeting { font-size: 20px; font-weight: 700; color: #333; }
        .greeting-sub { font-size: 13px; color: #888; margin-bottom: 18px; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <div class="greeting" id="greeting">仪表盘</div>
    <div class="greeting-sub" id="greetingSub">系统运行概览</div>

    <!-- 统计卡片：系统资源 -->
    <div class="row mb-3">
        <div class="col-md-3 mb-2"><div class="stat-card bg-purple"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-value" id="st-users">-</div><div class="stat-label">用户总数</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-blue"><div class="stat-icon"><i class="fas fa-database"></i></div><div class="stat-value" id="st-schemas">-</div><div class="stat-label">Schema / 表 / 字段</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-green"><div class="stat-icon"><i class="fas fa-book"></i></div><div class="stat-value" id="st-knowledge">-</div><div class="stat-label">知识库条目</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-teal"><div class="stat-icon"><i class="fas fa-brain"></i></div><div class="stat-value" id="st-llm">-</div><div class="stat-label">LLM 调用次数</div></div></div>
    </div>

    <!-- 统计卡片：安全与同步 -->
    <div class="row mb-4">
        <div class="col-md-3 mb-2"><div class="stat-card bg-orange"><div class="stat-icon"><i class="fas fa-shield-alt"></i></div><div class="stat-value" id="st-blocked">-</div><div class="stat-label">被拦截查询 / 拦截率</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-red"><div class="stat-icon"><i class="fas fa-sync-alt"></i></div><div class="stat-value" id="st-sync-failed">-</div><div class="stat-label">同步失败次数</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-gray"><div class="stat-icon"><i class="fas fa-plug"></i></div><div class="stat-value" id="st-datasources">-</div><div class="stat-label">数据源（启用/总数）</div></div></div>
        <div class="col-md-3 mb-2"><div class="stat-card bg-blue"><div class="stat-icon"><i class="fas fa-tasks"></i></div><div class="stat-value" id="st-jobs">-</div><div class="stat-label">同步任务（启用/总数）</div></div></div>
    </div>

    <!-- 快捷入口 -->
    <div class="section-card">
        <div class="card-header">快捷入口</div>
        <div class="card-body p-3">
            <div class="d-flex flex-wrap gap-2">
                <a class="quick-link" href="#" onclick="jump('/static/template/schema/schema_view.html')"><i class="fas fa-table"></i> 数据浏览</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/schema/vector_index.html')"><i class="fas fa-vector-square"></i> 向量索引</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/system/sync_manage.html')"><i class="fas fa-sync-alt"></i> 同步管理</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/llm/llm_config.html')"><i class="fas fa-cogs"></i> 模型配置</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/system/security_manage.html#overview')"><i class="fas fa-shield-alt"></i> 安全中心</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/system/user_manage.html')"><i class="fas fa-users"></i> 用户管理</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/knowledge.html')"><i class="fas fa-book"></i> 知识库</a>
                <a class="quick-link" href="#" onclick="jump('/static/template/system/system_settings.html')"><i class="fas fa-tools"></i> 系统设置</a>
            </div>
        </div>
    </div>

    <div class="row">
        <!-- 最近同步记录 -->
        <div class="col-md-6">
            <div class="section-card">
                <div class="card-header">
                    <span>最近同步记录</span>
                    <a href="#" onclick="jump('/static/template/system/sync_manage.html#runs')" style="font-size:12px;color:#0d6efd;text-decoration:none;">查看全部 →</a>
                </div>
                <div class="card-body">
                    <table class="table table-hover table-sm mb-0">
                        <thead><tr><th>时间</th><th>Schema</th><th>状态</th><th>新增/改/删</th></tr></thead>
                        <tbody id="recentRuns"><tr><td colspan="4" class="empty-state">加载中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- 最近拦截记录 -->
        <div class="col-md-6">
            <div class="section-card">
                <div class="card-header">
                    <span>最近安全拦截</span>
                    <a href="#" onclick="jump('/static/template/system/security_manage.html#logs')" style="font-size:12px;color:#0d6efd;text-decoration:none;">查看全部 →</a>
                </div>
                <div class="card-body">
                    <table class="table table-hover table-sm mb-0">
                        <thead><tr><th>时间</th><th>用户</th><th>问题</th><th>拦截原因</th></tr></thead>
                        <tbody id="recentBlocked"><tr><td colspan="4" class="empty-state">加载中...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script>
function jump(url) {
    // 在父窗口（管理后台框架）中打开对应页面
    if (window.parent && window.parent.openWindow) {
        const map = {
            '/static/template/schema/schema_view.html': '数据浏览',
            '/static/template/schema/vector_index.html': '向量索引',
            '/static/template/system/sync_manage.html': '同步管理',
            '/static/template/system/sync_manage.html#runs': '同步历史',
            '/static/template/llm/llm_config.html': '模型配置',
            '/static/template/system/security_manage.html#overview': '审计概览',
            '/static/template/system/security_manage.html#logs': '审计日志',
            '/static/template/system/user_manage.html': '用户管理',
            '/static/template/knowledge.html': '知识库',
            '/static/template/system/system_settings.html': '系统设置',
        };
        window.parent.openWindow(map[url] || url, url);
    } else {
        window.location.href = url;
    }
}

async function loadAll() {
    const greeting = document.getElementById('greeting');
    const sub = document.getElementById('greetingSub');
    if (window.QF && window.QF.user) {
        const u = window.QF.user;
        const hour = new Date().getHours();
        const period = hour < 6 ? '凌晨好' : hour < 12 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
        greeting.textContent = `${period}，${u.username}`;
    }
    sub.textContent = '系统运行概览 · 更新于 ' + new Date().toLocaleString('zh-CN');

    // 用户数
    try {
        const resp = await apiRequest('/api/permission/users');
        const users = await resp.json();
        const active = users.filter(u => u.is_active).length;
        document.getElementById('st-users').textContent = `${active}/${users.length}`;
    } catch (e) { document.getElementById('st-users').textContent = '-'; }

    // Schema 统计
    try {
        const resp = await apiRequest('/api/schema/stats');
        const s = await resp.json();
        document.getElementById('st-schemas').textContent = `${s.schema_count || 0} / ${s.table_count || 0} / ${s.column_count || 0}`;
    } catch (e) { document.getElementById('st-schemas').textContent = '-'; }

    // 知识库
    try {
        const resp = await apiRequest('/api/knowledge?limit=1');
        const k = await resp.json();
        document.getElementById('st-knowledge').textContent = k.total || 0;
    } catch (e) { document.getElementById('st-knowledge').textContent = '-'; }

    // LLM 用量
    try {
        const resp = await apiRequest('/api/llm/stats');
        const l = await resp.json();
        document.getElementById('st-llm').textContent = (l.total_calls || 0).toLocaleString();
    } catch (e) { document.getElementById('st-llm').textContent = '-'; }

    // 审计统计
    try {
        const resp = await apiRequest('/api/audit/stats');
        const a = await resp.json();
        document.getElementById('st-blocked').textContent = `${a.blocked_queries || 0} / ${a.block_rate || '0%'}`;
    } catch (e) { document.getElementById('st-blocked').textContent = '-'; }

    // 同步统计
    try {
        const resp = await apiRequest('/api/sync/stats');
        const s = await resp.json();
        document.getElementById('st-sync-failed').textContent = s.runs?.failed || 0;
        document.getElementById('st-datasources').textContent = `${s.datasources?.active || 0}/${s.datasources?.total || 0}`;
        document.getElementById('st-jobs').textContent = `${s.jobs?.enabled || 0}/${s.jobs?.total || 0}`;
    } catch (e) { document.getElementById('st-sync-failed').textContent = '-'; }

    // 最近同步
    try {
        const resp = await apiRequest('/api/sync/runs?limit=5');
        const data = await resp.json();
        const tbody = document.getElementById('recentRuns');
        const items = data.items || [];
        if (!items.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无同步记录</td></tr>'; }
        else {
            tbody.innerHTML = items.map(r => `<tr>
                <td>${fmtTime(r.started_at)}</td>
                <td>${r.summary ? (JSON.parse(r.summary).schema || '-') : '-'}</td>
                <td><span class="badge badge-${r.status}">${r.status}</span></td>
                <td>${r.columns_added || 0}/${r.columns_modified || 0}/${r.columns_removed || 0}</td>
            </tr>`).join('');
        }
    } catch (e) { /* 静默 */ }

    // 最近拦截
    try {
        const resp = await apiRequest('/api/audit/logs?limit=5&blocked_only=true');
        const data = await resp.json();
        const tbody = document.getElementById('recentBlocked');
        const items = data.items || [];
        if (!items.length) { tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暂无拦截记录</td></tr>'; }
        else {
            tbody.innerHTML = items.map(r => `<tr>
                <td>${fmtTime(r.created_at)}</td>
                <td>${e(r.username)}</td>
                <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${e(r.query)}">${e(r.query)}</td>
                <td style="max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${e(r.block_reason)}">${e(r.block_reason)}</td>
            </tr>`).join('');
        }
    } catch (e) { /* 静默 */ }
}

window.QF.onReady = function () { loadAll(); };
</script>
</body>
</html>
