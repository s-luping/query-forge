<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安全中心</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/security_manage.css">
</head>
<body>
<div class="container-fluid py-3">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-tab="overview">审计概览</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="logs">审计日志</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="sensitive">敏感字段</button></li>
    </ul>
    <section id="tab-overview">
        <div class="row g-3 mb-3" id="stats"></div>
        <div class="card"><div class="card-header">最近拦截记录</div><div class="card-body p-0">
            <table class="table table-sm mb-0"><thead><tr><th>时间</th><th>用户</th><th>问题</th><th>原因</th></tr></thead>
            <tbody id="recent"></tbody></table>
        </div></div>
    </section>
    <section id="tab-logs" hidden>
        <div class="card"><div class="card-header d-flex justify-content-between"><span>查询审计日志</span><button class="btn btn-sm btn-outline-secondary" onclick="loadLogs()">刷新</button></div>
            <div class="card-body p-0"><table class="table table-sm mb-0"><thead><tr><th>时间</th><th>用户</th><th>问题</th><th>生成 SQL</th><th>状态</th><th>链路</th></tr></thead><tbody id="logs"></tbody></table></div>
        </div>
    </section>
    <section id="tab-sensitive" hidden>
        <div class="card"><div class="card-header d-flex justify-content-between align-items-center">
            <span>敏感字段</span>
            <div class="d-flex gap-2 align-items-center">
                <select id="sensitiveLevelFilter" class="form-select form-select-sm" style="width:140px;" onchange="sensitiveCur=1; loadSensitive()">
                    <option value="">全部等级</option>
                    <option value="public">公开</option>
                    <option value="internal">内部</option>
                    <option value="sensitive">敏感</option>
                    <option value="confidential">机密</option>
                </select>
                <input type="text" id="sensitiveSearch" class="form-control form-control-sm" style="width:200px;" placeholder="搜索数据库 / 表 / 字段..." oninput="sensitiveCur=1; loadSensitive()">
                <button class="btn btn-sm btn-outline-secondary" onclick="sensitiveCur=1; loadSensitive()">搜索</button>
            </div>
        </div><div class="card-body p-0">
            <table class="table table-sm mb-0"><thead><tr><th>数据库</th><th>表</th><th>字段</th><th>注释</th><th>当前等级</th><th>修改</th></tr></thead><tbody id="sensitive"></tbody></table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center py-2">
            <span class="text-muted" style="font-size:12px;" id="sensitiveCount"></span>
            <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-sm btn-outline-secondary" onclick="sensitivePage(-1)" id="sensitivePrev">‹ 上一页</button>
                <span style="font-size:13px;" id="sensitivePageInfo">1 / 1</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="sensitivePage(1)" id="sensitiveNext">下一页 ›</button>
            </div>
        </div></div>
    </section>
</div>

<!-- 链路追踪详情弹窗 -->
<div class="modal fade" id="pipelineModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">链路追踪 — 鉴权 → 模型 → 知识 → 召回 → 判断 → 生成 → 网关 → 执行</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="pipelineDetail" style="max-height:70vh;overflow-y:auto;"></div>
        </div>
    </div>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script src="/static/js/security_manage.js"></script>
</body>
</html>
