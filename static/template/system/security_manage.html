<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>安全中心</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .stat-card { border-radius: 8px; padding: 18px; color: white; text-align: center; }
        .stat-value { font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 13px; opacity: .9; }
        .stat-total { background: #315c8c; } .stat-blocked { background: #b94a48; }
        .stat-sensitive { background: #b87924; } .stat-rate { background: #34745d; }
        .sql-cell { max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-tab="overview">审计概览</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="logs">审计日志</button></li>
        <li class="nav-item"><button class="nav-link" data-tab="sensitive">敏感字段</button></li>
    </ul>
    <section id="tab-overview">
        <div class="row g-3 mb-3" id="stats"></div>
        <div class="card"><div class="card-header">最近拦截记录</div><div class="card-body p-0">
            <table class="table table-sm mb-0"><thead><tr><th>时间</th><th>用户</th><th>问题</th><th>原因</th></tr></thead>
            <tbody id="recent"></tbody></table>
        </div></div>
    </section>
    <section id="tab-logs" hidden>
        <div class="card"><div class="card-header d-flex justify-content-between"><span>查询审计日志</span><button class="btn btn-sm btn-outline-secondary" onclick="loadLogs()">刷新</button></div>
            <div class="card-body p-0"><table class="table table-sm mb-0"><thead><tr><th>时间</th><th>用户</th><th>问题</th><th>生成 SQL</th><th>状态</th></tr></thead><tbody id="logs"></tbody></table></div>
        </div>
    </section>
    <section id="tab-sensitive" hidden>
        <div class="card"><div class="card-header">敏感字段</div><div class="card-body p-0">
            <table class="table table-sm mb-0"><thead><tr><th>数据库</th><th>表</th><th>字段</th><th>当前等级</th><th>修改</th></tr></thead><tbody id="sensitive"></tbody></table>
        </div></div>
    </section>
</div>
<script src="/static/js/app_common.js"></script>
<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url, options) { const response = await apiRequest(url, options); return response.json(); }
async function loadStats() {
    const data = await get('/api/audit/stats');
    document.getElementById('stats').innerHTML = [['total_queries','总查询数','stat-total'],['blocked_queries','被拦截','stat-blocked'],['sensitive_hits','敏感命中','stat-sensitive'],['block_rate','拦截率','stat-rate']].map(([key, label, cls]) => `<div class="col-md-3"><div class="stat-card ${cls}"><div class="stat-value">${esc(data[key])}</div><div class="stat-label">${label}</div></div></div>`).join('');
    const logs = await get('/api/audit/logs?blocked_only=true&limit=10');
    document.getElementById('recent').innerHTML = logs.items.map(item => `<tr><td>${esc(item.created_at)}</td><td>${esc(item.username)}</td><td>${esc(item.query)}</td><td>${esc(item.block_reason)}</td></tr>`).join('') || '<tr><td colspan="4" class="text-center text-muted">暂无记录</td></tr>';
}
async function loadLogs() {
    const data = await get('/api/audit/logs?limit=100');
    document.getElementById('logs').innerHTML = data.items.map(item => `<tr><td>${esc(item.created_at)}</td><td>${esc(item.username)}</td><td>${esc(item.query)}</td><td class="sql-cell" title="${esc(item.generated_sql)}">${esc(item.generated_sql)}</td><td>${item.was_blocked ? '已拦截' : '通过'}</td></tr>`).join('');
}
async function loadSensitive() {
    const data = await get('/api/audit/all-columns');
    document.getElementById('sensitive').innerHTML = data.items.map(item => `<tr><td>${esc(item.schema_name)}</td><td>${esc(item.table_name)}</td><td>${esc(item.column_name)}</td><td>${esc(item.sensitive_level)}</td><td><select class="form-select form-select-sm" onchange="updateSensitive(${item.column_id}, this.value)"><option value="public" ${item.sensitive_level === 'public' ? 'selected' : ''}>public</option><option value="internal" ${item.sensitive_level === 'internal' ? 'selected' : ''}>internal</option><option value="sensitive" ${item.sensitive_level === 'sensitive' ? 'selected' : ''}>sensitive</option><option value="confidential" ${item.sensitive_level === 'confidential' ? 'selected' : ''}>confidential</option></select></td></tr>`).join('');
}
async function updateSensitive(columnId, level) { await get('/api/audit/sensitive-level', { method: 'PUT', body: JSON.stringify({column_id: columnId, sensitive_level: level}) }); }
document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => { document.querySelectorAll('[data-tab]').forEach(item => item.classList.remove('active')); button.classList.add('active'); ['overview','logs','sensitive'].forEach(tab => document.getElementById('tab-' + tab).hidden = tab !== button.dataset.tab); if (button.dataset.tab === 'logs') loadLogs(); if (button.dataset.tab === 'sensitive') loadSensitive(); }));
loadStats();
</script>
</body>
</html>
