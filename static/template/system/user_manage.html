<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
</head>
<body>
<div class="container-fluid">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>用户管理 <small class="text-muted" style="font-weight:normal;">（公司内部多用户 · 10-150 人规模）</small></span>
            <button class="btn btn-primary btn-sm" onclick="openCreate()">＋ 新建用户</button>
        </div>
        <div class="card-body p-0">
            <div class="d-flex align-items-center justify-content-between px-3 py-2 border-bottom" style="background:#f8fafc;">
                <div class="search-box" style="position:relative;">
                    <i class="fas fa-search" style="position:absolute;left:10px;top:8px;color:#aaa;font-size:12px;"></i>
                    <input type="text" id="userSearch" class="form-control form-control-sm" style="padding-left:28px;width:220px;"
                           placeholder="搜索用户名/邮箱..." oninput="onUserSearch()">
                </div>
                <span class="text-muted" id="userCount" style="font-size:12px;"></span>
            </div>
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>ID</th><th>用户名</th><th>邮箱</th><th>角色</th><th>状态</th>
                        <th>注册时间</th><th>最近登录</th><th style="width:280px;">操作</th>
                    </tr>
                </thead>
                <tbody id="userTable"><tr><td colspan="8" class="text-center py-3 text-muted">加载中...</td></tr></tbody>
            </table>
            <div class="pager-wrap" id="userPager"></div>
        </div>
    </div>
</div>

<!-- 新建用户 -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">新建用户</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="createForm" onsubmit="submitCreate(); return false;">
                <div class="modal-body">
                    <div class="mb-2"><label class="form-label mb-1">用户名 <span class="text-danger">*</span></label>
                        <input type="text" id="c-username" class="form-control form-control-sm" minlength="3" autocomplete="username" required></div>
                    <div class="mb-2"><label class="form-label mb-1">初始密码 <span class="text-danger">*</span>（≥8位，含大小写字母+数字+特殊字符）</label>
                        <input type="password" id="c-password" class="form-control form-control-sm" autocomplete="new-password" required></div>
                    <div class="mb-2"><label class="form-label mb-1">邮箱</label>
                        <input type="email" id="c-email" class="form-control form-control-sm" autocomplete="email"></div>
                    <div class="mb-2"><label class="form-label mb-1">角色</label>
                        <select id="c-role" class="form-select form-select-sm">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select></div>
                    <div class="mb-2"><label class="form-label mb-1">描述</label>
                        <input type="text" id="c-desc" class="form-control form-control-sm" maxlength="255"></div>
                    <div class="form-check">
                        <input type="checkbox" id="c-active" class="form-check-input" checked>
                        <label class="form-check-label" for="c-active">创建后立即启用（可登录）</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary btn-sm">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 编辑用户 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">编辑用户 — <span id="e-username-label"></span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm" onsubmit="submitEdit(); return false;">
                <div class="modal-body">
                    <input type="hidden" id="e-user-id">
                    <div class="mb-2"><label class="form-label mb-1">邮箱</label>
                        <input type="email" id="e-email" class="form-control form-control-sm" autocomplete="email"></div>
                    <div class="mb-2"><label class="form-label mb-1">角色</label>
                        <select id="e-role" class="form-select form-select-sm">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select></div>
                    <div class="mb-2"><label class="form-label mb-1">描述</label>
                        <input type="text" id="e-desc" class="form-control form-control-sm" maxlength="255"></div>
                    <div class="form-check">
                        <input type="checkbox" id="e-active" class="form-check-input">
                        <label class="form-check-label" for="e-active">启用（可登录）</label>
                    </div>
                    <div class="text-muted mt-2" style="font-size:12px;">提示：不能禁用/降级自己的账号，系统至少保留一名管理员。</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary btn-sm">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 重置密码 -->
<div class="modal fade" id="resetModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">重置密码 — <span id="r-username-label"></span></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="resetForm" onsubmit="submitReset(); return false;">
                <div class="modal-body">
                    <input type="hidden" id="r-user-id">
                    <div class="mb-2"><label class="form-label mb-1">新密码 <span class="text-danger">*</span>（≥8位，含大小写字母+数字+特殊字符）</label>
                        <input type="password" id="r-password" class="form-control form-control-sm" autocomplete="new-password" required></div>
                    <div class="mb-2"><label class="form-label mb-1">确认新密码 <span class="text-danger">*</span></label>
                        <input type="password" id="r-password2" class="form-control form-control-sm" autocomplete="new-password" required></div>
                    <div class="text-muted" style="font-size:12px;">重置后该用户所有已登录会话将立即失效，需用新密码重新登录。</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-warning btn-sm">重置密码</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script>
let users = [];
let createModal = null, editModal = null, resetModal = null;

// 统一关闭：优先走 Bootstrap 实例（含遮罩/动画清理），再兜底移除样式
function hideModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    const inst = bootstrap.Modal.getInstance(el);
    if (inst) inst.hide();
    el.classList.remove('show');
    el.style.display = 'none';
}

function fmtDate(s) { return s ? String(s).replace('T', ' ').slice(0, 19) : '-'; }

// 用户列表分页（20/页）+ 搜索
let userPage = 1, userSearch = '';
const USER_PS = 20;

async function loadUsers() {
    const resp = await apiRequest('/api/user/list');
    if (!resp.ok) { showErr('加载用户列表失败'); return; }
    users = await resp.json();
    userPage = 1;
    renderUserTable();
}

function renderUserTable() {
    const kw = userSearch.toLowerCase();
    const filtered = users.filter(u =>
        !kw || (u.username || '').toLowerCase().includes(kw) || ((u.email || '') || '').toLowerCase().includes(kw));
    const pageItems = filtered.slice((userPage - 1) * USER_PS, userPage * USER_PS);
    document.getElementById('userCount').textContent = `共 ${filtered.length} 个用户`;
    const tbody = document.getElementById('userTable');
    tbody.innerHTML = pageItems.length ? pageItems.map(u => `
        <tr>
            <td>${u.user_id}</td>
            <td>${e(u.username)}</td>
            <td>${e(u.email) || '-'}</td>
            <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role === 'admin' ? '管理员' : '普通用户'}</span></td>
            <td>${u.is_active === 1 ? '<span class="badge bg-success">启用</span>' : '<span class="badge badge-off">禁用</span>'}</td>
            <td>${fmtDate(u.register_date)}</td>
            <td>${fmtDate(u.last_login)}</td>
            <td class="text-nowrap">
                <button class="btn btn-outline-primary btn-sm" onclick="openEdit(${u.user_id})">编辑</button>
                <button class="btn btn-outline-warning btn-sm" onclick="openReset(${u.user_id})">重置密码</button>
                <button class="btn btn-outline-secondary btn-sm" onclick="toggleActive(${u.user_id})">${u.is_active === 1 ? '禁用' : '启用'}</button>
                <button class="btn btn-outline-danger btn-sm" onclick="delUser(${u.user_id})">删除</button>
            </td>
        </tr>`).join('')
        : '<tr><td colspan="8" class="text-center py-3 text-muted">暂无用户</td></tr>';
    QF.renderPager('userPager', {
        total: filtered.length, page: userPage, pageSize: USER_PS,
        onPage: p => { userPage = p; renderUserTable(); }
    });
}

function onUserSearch() {
    userSearch = document.getElementById('userSearch').value.trim();
    userPage = 1;
    renderUserTable();
}

// ── 新建 ──────────────────────────────────────────────
function openCreate() { createModal.show(); }

async function submitCreate() {
    const body = {
        username: document.getElementById('c-username').value.trim(),
        password: document.getElementById('c-password').value,
        email: document.getElementById('c-email').value.trim() || null,
        role: document.getElementById('c-role').value,
        description: document.getElementById('c-desc').value.trim() || null,
        is_active: document.getElementById('c-active').checked ? 1 : 0,
    };
    if (body.username.length < 3) return alert('用户名至少需要3个字符');
    const resp = await apiRequest('/api/user/create', { method: 'POST', body: JSON.stringify(body) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) return alert(data.detail || '创建失败');
    alert(data.message || '用户创建成功');
    createModal.hide();
    loadUsers();
}

// ── 编辑 ──────────────────────────────────────────────
function openEdit(uid) {
    const u = users.find(x => x.user_id === uid);
    if (!u) return;
    document.getElementById('e-user-id').value = uid;
    document.getElementById('e-username-label').textContent = u.username;
    document.getElementById('e-email').value = u.email || '';
    document.getElementById('e-role').value = u.role;
    document.getElementById('e-desc').value = u.description || '';
    document.getElementById('e-active').checked = u.is_active === 1;
    editModal.show();
}

async function submitEdit() {
    const uid = document.getElementById('e-user-id').value;
    const body = {
        email: document.getElementById('e-email').value.trim() || null,
        role: document.getElementById('e-role').value,
        description: document.getElementById('e-desc').value.trim() || null,
        is_active: document.getElementById('e-active').checked ? 1 : 0,
    };
    const resp = await apiRequest(`/api/user/${uid}`, { method: 'PUT', body: JSON.stringify(body) });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) return alert(data.detail || '保存失败');
    alert(data.message || '已保存');
    editModal.hide();
    loadUsers();
}

// ── 启用/禁用 ────────────────────────────────────────
async function toggleActive(uid) {
    const u = users.find(x => x.user_id === uid);
    if (!u) return;
    const next = u.is_active === 1 ? 0 : 1;
    const resp = await apiRequest(`/api/user/${uid}`, {
        method: 'PUT', body: JSON.stringify({ is_active: next })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) return alert(data.detail || '操作失败');
    loadUsers();
}

// ── 重置密码 ─────────────────────────────────────────
function openReset(uid) {
    const u = users.find(x => x.user_id === uid);
    if (!u) return;
    document.getElementById('r-user-id').value = uid;
    document.getElementById('r-username-label').textContent = u.username;
    document.getElementById('r-password').value = '';
    document.getElementById('r-password2').value = '';
    resetModal.show();
}

async function submitReset() {
    const uid = document.getElementById('r-user-id').value;
    const p1 = document.getElementById('r-password').value;
    const p2 = document.getElementById('r-password2').value;
    if (p1 !== p2) return alert('两次输入的密码不一致');
    const resp = await apiRequest(`/api/user/${uid}/reset-password`, {
        method: 'POST', body: JSON.stringify({ new_password: p1 })
    });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) return alert(data.detail || '重置失败');
    alert(data.message || '密码已重置');
    resetModal.hide();
}

// ── 删除 ─────────────────────────────────────────────
async function delUser(uid) {
    const u = users.find(x => x.user_id === uid);
    if (!u) return;
    if (!confirm(`确定删除用户「${u.username}」？\n\n将同时清除其授权、对话、模型配置、知识库等关联数据，且不可恢复。\n（企业建议：不确定时请改用「禁用」）`)) return;
    const resp = await apiRequest(`/api/user/${uid}`, { method: 'DELETE' });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) return alert(data.detail || '删除失败');
    alert(data.message || '已删除');
    loadUsers();
}

function showErr(msg) { document.getElementById('userTable').innerHTML = `<tr><td colspan="8" class="text-center py-3 text-danger">${e(msg)}</td></tr>`; }

// 兜底：data-bs-dismiss 之外再挂一层点击委托（幂等，防个别场景 Bootstrap 实例未初始化）
document.addEventListener('click', function (ev) {
    const btn = ev.target.closest('[data-bs-dismiss="modal"]');
    if (btn) {
        const m = btn.closest('.modal');
        if (m) hideModal(m.id);
    }
});

// 点击遮罩关闭
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', ev => {
    if (ev.target === m) hideModal(m.id);
}));

document.addEventListener('DOMContentLoaded', function () {
    createModal = new bootstrap.Modal(document.getElementById('createModal'));
    editModal = new bootstrap.Modal(document.getElementById('editModal'));
    resetModal = new bootstrap.Modal(document.getElementById('resetModal'));
    loadUsers();
});
</script>
</body>
</html>
