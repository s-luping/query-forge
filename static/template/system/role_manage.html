<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角色与权限</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/role_manage.css">
</head>
<body>
<div class="container-fluid rm-page">

    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <strong class="rm-title" id="roleTitle">角色与权限</strong>
                <div class="d-flex flex-wrap gap-2 align-items-center">
                    <select id="roleSelect" class="form-select form-select-sm" style="flex:1 1 220px;min-width:0;" onchange="selectRole(this.value)">
                        <option value="">请选择角色...</option>
                    </select>
                    <button class="btn btn-primary btn-sm" onclick="openCreateRole()">＋ 新建角色</button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteRole()" id="btnDeleteRole" style="display:none;">删除</button>
                </div>
            </div>
            <div class="row g-2 align-items-end">
                <div class="col-12 col-md-9">
                    <label class="form-label small text-muted">角色说明</label>
                    <input id="roleDescription" class="form-control" placeholder="角色职责与用途说明">
                </div>
                <div class="col-12 col-md-3 d-flex align-items-end">
                    <button class="btn btn-outline-primary w-100" onclick="saveDescription()">保存说明</button>
                </div>
            </div>
        </div>
    </div>

    <div class="card rm-card">
        <div class="rm-tabs-wrap">
            <ul class="nav rm-tabs">
                <li class="nav-item"><button class="nav-link active" data-tab="ds">数据源授权</button></li>
                <li class="nav-item"><button class="nav-link" data-tab="schema">数据库授权</button></li>
                <li class="nav-item"><button class="nav-link" data-tab="table">表授权</button></li>
                <li class="nav-item"><button class="nav-link" data-tab="knowledge">知识条目授权</button></li>
            </ul>
        </div>
        <div class="card-body">
            <section id="tab-ds" class="rm-pane is-ds">
                <p class="rm-hint">允许某数据源 = 该数据源下全部库表可见；勾选「全部数据源」= 一键全量授权</p>
                <div id="dsArea"></div>
            </section>
            <section id="tab-schema" class="rm-pane is-schema" hidden>
                <p class="rm-hint">需所属数据源已授权才生效（数据源为总闸）</p>
                <div id="schemaArea" style="max-height:440px;overflow-y:auto;"></div>
            </section>
            <section id="tab-table" class="rm-pane is-table" hidden>
                <div class="d-flex justify-content-end mb-2">
                    <input class="form-control form-control-sm search-box" placeholder="过滤表名..." oninput="renderTables(this.value)">
                </div>
                <div id="tableArea" style="max-height:440px;overflow-y:auto;"></div>
            </section>
            <section id="tab-knowledge" class="rm-pane is-knowledge" hidden>
                <div class="d-flex justify-content-end mb-2">
                    <input class="form-control form-control-sm search-box" placeholder="过滤..." oninput="renderKnowledge(this.value)">
                </div>
                <div id="knowledgeArea" style="max-height:320px;overflow-y:auto;"></div>
            </section>
        </div>
    </div>

    <div class="rm-actions">
        <button class="btn btn-outline-secondary btn-sm" onclick="resetAll()">重置未保存改动</button>
        <button class="btn btn-primary btn-sm" onclick="savePermissions()">保存权限</button>
    </div>
</div>

<div class="modal fade" id="createRoleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title">新建角色</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2"><label class="form-label">角色名称 <span class="text-danger">*</span></label>
                    <input id="crName" class="form-control" placeholder="如：数据分析师"></div>
                <div class="mb-2"><label class="form-label">角色编码 <span class="text-danger">*</span>（英文/数字/下划线）</label>
                    <input id="crCode" class="form-control" placeholder="如：analyst"></div>
                <div class="mb-2"><label class="form-label">角色说明</label>
                    <input id="crDesc" class="form-control"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="submitCreateRole()">创建</button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script src="/static/js/role_manage.js"></script>
</body>
</html>
