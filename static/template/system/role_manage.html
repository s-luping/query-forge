<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角色与权限</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body { background: #f6f8fb; }
        .role-list { max-height: 520px; overflow-y: auto; }
        .role-item { cursor: pointer; border-bottom: 1px solid #edf0f4; padding: 12px 14px; }
        .role-item:hover, .role-item.active { background: #eaf2ff; }
        .role-item.active { border-left: 3px solid #0d6efd; padding-left: 11px; }
        .permission-table input, .permission-table select { min-width: 100px; }
        .muted { color: #7b8492; font-size: 12px; }
        .sticky-head { position: sticky; top: 0; z-index: 1; background: #fff; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <div class="row g-3">
        <div class="col-lg-3">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>角色</strong><button class="btn btn-primary btn-sm" onclick="createRole()">新建</button>
                </div>
                <div id="roleList" class="role-list"><div class="p-3 text-muted">加载中...</div></div>
            </div>
        </div>
        <div class="col-lg-9">
            <div class="card mb-3">
                <div class="card-header"><strong id="roleTitle">请选择角色</strong></div>
                <div class="card-body">
                    <div class="row g-2 align-items-end">
                        <div class="col-md-5"><label class="form-label">角色说明</label><input id="roleDescription" class="form-control"></div>
                        <div class="col-md-7"><span class="muted">权限按角色统一配置，用户仅通过角色继承权限。</span></div>
                    </div>
                    <hr>
                    <label class="form-label">分配用户</label>
                    <div id="userList" class="d-flex flex-wrap gap-2"></div>
                    <button class="btn btn-primary btn-sm mt-3" onclick="saveUsers()">保存角色用户</button>
                </div>
            </div>
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>角色资源权限</strong>
                    <button class="btn btn-primary btn-sm" onclick="savePermissions()">保存权限</button>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover align-middle mb-0 permission-table">
                            <thead class="sticky-head"><tr><th>权限编码</th><th>资源类型</th><th>资源ID</th><th>路由/页面/键</th><th>级别</th><th>行过滤</th><th></th></tr></thead>
                            <tbody id="permissionRows"></tbody>
                        </table>
                    </div>
                    <div class="p-2"><button class="btn btn-outline-secondary btn-sm" onclick="addPermission()">添加权限项</button></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/app_common.js"></script>
<script>
let roles = [], users = [], selectedRole = null, permissions = [];
const types = ['route', 'page', 'schema', 'table', 'column', 'knowledge', 'row'];
const levels = ['ALLOW', 'SELECT', 'FILTER', 'NONE', 'DENY'];

async function load() {
    roles = await (await apiRequest('/api/permission/roles')).json();
    users = await (await apiRequest('/api/permission/users')).json();
    renderRoles();
    if (roles.length) selectRole(roles[0].id);
}
function renderRoles() {
    document.getElementById('roleList').innerHTML = roles.map(r => `
        <div class="role-item ${selectedRole && selectedRole.id === r.id ? 'active' : ''}" onclick="selectRole(${r.id})">
            <div><strong>${esc(r.name)}</strong> <span class="badge bg-secondary">${esc(r.code)}</span></div>
            <div class="muted">${r.user_count} 用户 · ${r.permission_count} 权限</div>
        </div>`).join('') || '<div class="p-3 text-muted">暂无角色</div>';
}
async function selectRole(id) {
    selectedRole = roles.find(r => r.id === id);
    if (!selectedRole) return;
    renderRoles();
    document.getElementById('roleTitle').textContent = `${selectedRole.name}（${selectedRole.code}）`;
    document.getElementById('roleDescription').value = selectedRole.description || '';
    const assigned = await (await apiRequest(`/api/permission/roles/${id}/permissions`)).json();
    permissions = assigned.map(normalizePermission);
    const assignedUsers = await (await apiRequest(`/api/permission/roles/${id}/users`)).json().catch(() => []);
    renderUsers(assignedUsers.map(x => x.id));
    renderPermissions();
}
function renderUsers(selected) {
    document.getElementById('userList').innerHTML = users.map(u => `
        <label class="form-check form-check-inline"><input class="form-check-input role-user" type="checkbox" value="${u.id}" ${selected.includes(u.id) ? 'checked' : ''}><span class="form-check-label">${esc(u.username)}</span></label>`).join('');
}
async function saveUsers() {
    if (!selectedRole) return;
    const roleIds = [...document.querySelectorAll('.role-user:checked')].map(x => +x.value);
    alert((await (await apiRequest(`/api/permission/roles/${selectedRole.id}/users`, { method: 'PUT', body: JSON.stringify({ user_ids: roleIds }) })).json()).message || '已保存');
}
function normalizePermission(p) { return { permission_code: p.permission_code || '', resource_type: p.resource_type || 'route', resource_id: p.resource_id || '', resource_key: p.resource_key || '', access_type: p.access_type || 'ALLOW', filter_expression: p.filter_expression || '' }; }
function renderPermissions() {
    document.getElementById('permissionRows').innerHTML = permissions.map((p, i) => `<tr>
        <td><input class="form-control form-control-sm" value="${esc(p.permission_code)}" onchange="permissions[${i}].permission_code=this.value"></td>
        <td><select class="form-select form-select-sm" onchange="permissions[${i}].resource_type=this.value">${types.map(x => `<option ${x === p.resource_type ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td><input type="number" class="form-control form-control-sm" value="${p.resource_id}" onchange="permissions[${i}].resource_id=this.value ? +this.value : null"></td>
        <td><input class="form-control form-control-sm" value="${esc(p.resource_key)}" onchange="permissions[${i}].resource_key=this.value"></td>
        <td><select class="form-select form-select-sm" onchange="permissions[${i}].access_type=this.value">${levels.map(x => `<option ${x === p.access_type ? 'selected' : ''}>${x}</option>`).join('')}</select></td>
        <td><input class="form-control form-control-sm" value="${esc(p.filter_expression)}" onchange="permissions[${i}].filter_expression=this.value"></td>
        <td><button class="btn btn-outline-danger btn-sm" onclick="permissions.splice(${i}, 1); renderPermissions()">删除</button></td>
    </tr>`).join('');
}
function addPermission() { permissions.push(normalizePermission({})); renderPermissions(); }
async function savePermissions() {
    if (!selectedRole) return;
    const resp = await apiRequest(`/api/permission/roles/${selectedRole.id}/permissions`, { method: 'PUT', body: JSON.stringify({ permissions }) });
    const data = await resp.json(); if (!resp.ok) return alert(data.detail || '保存失败');
    alert(data.message || '已保存'); load();
}
async function createRole() {
    const name = prompt('角色名称'); if (!name) return;
    const code = prompt('角色编码（英文/数字/下划线）'); if (!code) return;
    const resp = await apiRequest('/api/permission/roles', { method: 'POST', body: JSON.stringify({ name, code }) });
    const data = await resp.json(); if (!resp.ok) return alert(data.detail || '创建失败'); load();
}
function esc(v) { return String(v || '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])); }
load();
</script>
</body>
</html>
