<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系统定时任务</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body { background: #f6f8fb; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .status-dot.on { background: #198754; } .status-dot.off { background: #dc3545; }
        .task-card { border: 1px solid #e5e9ef; border-radius: 8px; background: #fff; }
        .task-card + .task-card { margin-top: 12px; }
        .task-meta { color: #6c757d; font-size: 12px; }
        code { color: #495057; }
    </style>
</head>
<body>
<div class="container-fluid py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><h5 class="mb-1">系统定时任务</h5><div class="text-muted small">调度器时区：Asia/Shanghai（北京时间）</div></div>
        <button class="btn btn-outline-secondary btn-sm" onclick="loadTasks()">刷新</button>
    </div>
    <div id="schedulerState" class="alert alert-secondary py-2">加载中...</div>
    <div id="taskList"></div>
</div>
<script src="/static/js/app_common.js"></script>
<script>
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadTasks() {
    try {
        const resp = await apiRequest('/api/scheduler/tasks');
        const data = await resp.json();
        document.getElementById('schedulerState').className = `alert ${data.running ? 'alert-success' : 'alert-danger'} py-2`;
        document.getElementById('schedulerState').innerHTML = `<span class="status-dot ${data.running ? 'on' : 'off'}"></span>调度器${data.running ? '运行中' : '未启动'} · ${esc(data.timezone)}`;
        document.getElementById('taskList').innerHTML = (data.items || []).map(task => `
            <div class="task-card p-3">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                        <h6 class="mb-1">${esc(task.name)}</h6>
                        <div class="task-meta">任务 ID：<code>${esc(task.job_id)}</code> · 函数：<code>${esc(task.function)}</code></div>
                    </div>
                    <span class="badge ${task.paused ? 'bg-secondary' : 'bg-success'}">${task.paused ? '已暂停' : '运行中'}</span>
                </div>
                <div class="row mt-3 g-2 small">
                    <div class="col-md-4"><span class="text-muted">触发规则</span><br>${esc(task.trigger)}</div>
                    <div class="col-md-4"><span class="text-muted">下次执行</span><br>${esc(task.next_run_time || '未计划')}</div>
                    <div class="col-md-4"><span class="text-muted">最大并发</span><br>${esc(task.max_instances)}</div>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <button class="btn btn-sm btn-outline-primary" onclick="runTask('${esc(task.job_id)}')">立即执行</button>
                    ${task.paused ? `<button class="btn btn-sm btn-outline-success" onclick="resumeTask('${esc(task.job_id)}')">恢复</button>` : `<button class="btn btn-sm btn-outline-warning" onclick="pauseTask('${esc(task.job_id)}')">暂停</button>`}
                </div>
            </div>`).join('') || '<div class="text-muted">暂无系统定时任务</div>';
    } catch (error) {
        document.getElementById('schedulerState').className = 'alert alert-danger py-2';
        document.getElementById('schedulerState').textContent = '加载失败：' + error.message;
    }
}
async function taskAction(id, action) {
    const resp = await apiRequest(`/api/scheduler/tasks/${id}/${action}`, { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) return QF.toast(data.detail || '操作失败', 'danger');
    QF.toast(data.message || '操作成功', 'success');
    loadTasks();
}
function runTask(id) { taskAction(id, 'run'); }
function pauseTask(id) { taskAction(id, 'pause'); }
function resumeTask(id) { taskAction(id, 'resume'); }
loadTasks();
setInterval(loadTasks, 15000);
</script>
</body>
</html>
