<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库驱动管理</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .driver-badge-ok { background: #28a745; color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .driver-badge-missing { background: #dc3545; color: #fff; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .python-path { font-family: Consolas, monospace; font-size: 12px; color: #64748b; word-break: break-all; }
        .output-box {
            display: none; margin-top: 10px; background: #0f172a; color: #cbd5e1;
            font-family: Consolas, monospace; font-size: 12px; padding: 10px 12px;
            border-radius: 6px; max-height: 220px; overflow: auto; white-space: pre-wrap;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>数据库驱动管理 <small class="text-muted" style="font-weight:normal;">数据同步连接外部数据库所需的驱动，缺失时一键安装</small></span>
            <button class="btn btn-outline-secondary btn-sm" onclick="loadDrivers()">🔄 刷新</button>
        </div>
        <div class="card-body p-0">
            <div class="px-3 py-2 border-bottom" style="background:#f8fafc;">
                <span class="text-muted" style="font-size:12px;">当前服务解释器（驱动将安装到此解释器）:</span>
                <div class="python-path" id="pythonPath">加载中...</div>
            </div>
            <table class="table table-hover mb-0">
                <thead>
                    <tr>
                        <th>数据库类型</th>
                        <th>驱动模块</th>
                        <th>安装包</th>
                        <th>状态</th>
                        <th style="width:120px;">操作</th>
                    </tr>
                </thead>
                <tbody id="driverTable">
                    <tr><td colspan="5" class="text-center py-3 text-muted">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="msgBox" class="alert alert-info mt-2" style="display:none;"></div>
    <div id="outputBox" class="output-box"></div>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script>
let drivers = [];

function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.className = 'alert alert-' + (type || 'info') + ' mt-2';
    box.style.display = 'block';
    box.textContent = text;
}

async function loadDrivers() {
    const tbody = document.getElementById('driverTable');
    try {
        const resp = await apiRequest('/api/driver/list');
        if (!resp.ok) { tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-danger">加载失败</td></tr>'; return; }
        const data = await resp.json();
        drivers = data.items || [];
        document.getElementById('pythonPath').textContent = data.python || '-';
        tbody.innerHTML = drivers.map(d => `
            <tr>
                <td>${e(d.display)}</td>
                <td><code>${e(d.module)}</code></td>
                <td>${d.builtin ? '<span class="text-muted">-</span>' : `<code>${e(d.package)}</code>`}</td>
                <td>${d.installed
                    ? `<span class="driver-badge-ok">已安装</span> <small class="text-muted">${e(d.version)}</small>`
                    : '<span class="driver-badge-missing">未安装</span>'}
                </td>
                <td>
                    ${(d.builtin || d.installed)
                        ? '<span class="text-muted" style="font-size:12px;">-</span>'
                        : `<button class="btn btn-primary btn-sm" onclick="installDriver('${e(d.package)}', this)">安装</button>`}
                </td>
            </tr>`).join('');
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3 text-danger">加载失败: ' + e(err.message) + '</td></tr>';
    }
}

async function installDriver(pkg, btn) {
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = '安装中...';
    showMsg(`正在安装 ${pkg}（pip install 到服务解释器），请稍候...`, 'info');
    try {
        const resp = await apiRequest('/api/driver/install', {
            method: 'POST', body: JSON.stringify({ package: pkg })
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            showMsg(data.message, 'success');
        } else {
            showMsg(data.detail || data.message || '安装失败', 'danger');
        }
        if (data.output && data.output.length) {
            showOutput(data.output.join('\n'));
        }
    } catch (err) {
        showMsg('安装请求失败: ' + err.message, 'danger');
    }
    btn.disabled = false;
    btn.textContent = oldText;
    loadDrivers();
}

function showOutput(text) {
    const box = document.getElementById('outputBox');
    box.style.display = 'block';
    box.textContent = text;
}

document.addEventListener('DOMContentLoaded', loadDrivers);
</script>
</body>
</html>
