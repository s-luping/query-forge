<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <style>
        body { background: #f4f6fa; font-size: 14px; }
        .container-fluid { padding: 20px; max-width: 750px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .card-header { background: white; border-bottom: 1px solid #eee; font-weight: 600; padding: 15px 20px; border-radius: 12px 12px 0 0 !important; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-dot.ok { background: #28a745; }
        .status-dot.warn { background: #ffc107; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
        .setting-row:last-child { border-bottom: none; }
        .setting-key { font-weight: 500; color: #333; font-size: 13px; min-width: 120px; font-family: 'Consolas', monospace; }
        .setting-value { color: #666; font-size: 13px; word-break: break-all; text-align: right; }
        .setting-desc { color: #999; font-size: 11px; }
        .btn-sm2 { padding: 2px 10px; font-size: 12px; }
        .form-control-sm2 { font-size: 13px; padding: 4px 8px; }
        .section-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; padding: 8px 0 4px; border-bottom: 1px dashed #eee; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="container-fluid">

    <!-- 向量模型信息 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-brain me-2"></i>向量模型</div>
        <div class="card-body" id="embeddingInfo">
            <div class="setting-row">
                <span class="setting-key">EMBEDDING_MODEL_READY</span>
                <span class="setting-value">加载中...</span>
            </div>
            <div class="setting-row">
                <span class="setting-key">EMBEDDING_MODEL_PATH</span>
                <span class="setting-value">-</span>
            </div>
        </div>
    </div>

    <!-- JWT 配置 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-key me-2"></i>JWT 配置</div>
        <div class="card-body" id="jwtSettings">加载中...</div>
    </div>

    <!-- 向量索引参数 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-sliders-h me-2"></i>向量索引参数</div>
        <div class="card-body" id="vectorConfig">加载中...</div>
    </div>

    <!-- 操作 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-tools me-2"></i>操作</div>
        <div class="card-body">
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary" id="btnDownload" onclick="downloadEmbedding()">
                    📥 下载 Embedding 模型
                </button>
                <button class="btn btn-outline-secondary" onclick="checkAll()">
                    🔄 刷新状态
                </button>
            </div>
            <div id="msgBox" class="mt-2" style="display:none;"></div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="/static/css/all.min.css">
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script>
const apiRequest = window.apiRequest || function(url, options = {}) {
    const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return fetch(url, { ...options, headers }).then(resp => {
        if (resp.status === 401) { window.parent.location.href = '/login'; throw new Error('登录已过期'); }
        return resp;
    });
};

function showMsg(text, type) {
    const box = document.getElementById('msgBox');
    box.style.display = 'block';
    box.className = 'mt-2 alert alert-' + (type || 'info');
    box.textContent = text;
}

async function checkAll() {
    await checkEmbedding();
    await loadSettings();
}

async function checkEmbedding() {
    try {
        const resp = await apiRequest('/api/system/embedding-status');
        const data = await resp.json();
        const container = document.getElementById('embeddingInfo');

        // status
        let readyHtml;
        if (data.ready) {
            readyHtml = '<span class="status-dot ok"></span>就绪 (true)';
            document.getElementById('btnDownload').style.display = 'none';
        } else if (data.downloaded) {
            readyHtml = '<span class="status-dot warn"></span>已下载待加载 (false)';
            document.getElementById('btnDownload').style.display = 'none';
        } else {
            readyHtml = '<span class="status-dot warn"></span>未下载 (false)';
            document.getElementById('btnDownload').style.display = '';
        }

        // path
        const path = data.model_path || '-';
        const pathDisplay = path !== '-' ? `<small>${escapeHtml(path)}</small>` : '<span class="text-muted">-</span>';

        container.innerHTML = `
            <div class="setting-row">
                <div><span class="setting-key">EMBEDDING_MODEL_READY</span><br><span class="setting-desc">模型就绪状态</span></div>
                <span class="setting-value">${readyHtml}</span>
            </div>
            <div class="setting-row">
                <div><span class="setting-key">EMBEDDING_MODEL_PATH</span><br><span class="setting-desc">本地模型路径</span></div>
                <span class="setting-value">${pathDisplay}</span>
            </div>
        `;
    } catch (e) {
        document.getElementById('embeddingInfo').innerHTML = '<div class="text-danger">检查失败: ' + e.message + '</div>';
    }
}

async function loadSettings() {
    try {
        const resp = await apiRequest('/api/system/settings');
        const items = await resp.json();

        // JWT 配置
        const jwtKeys = ['SECRET_KEY', 'ACCESS_TOKEN_EXPIRE_MINUTES'];
        const jwtItems = items.filter(s => jwtKeys.includes(s.key));
        document.getElementById('jwtSettings').innerHTML = jwtItems.map(s => renderSettingRow(s, {
            'SECRET_KEY': { desc: 'JWT 签名密钥', disabled: true },
            'ACCESS_TOKEN_EXPIRE_MINUTES': { desc: 'Token 有效时长（分钟）' }
        })).join('');

        // 向量索引参数
        const vecKeys = ['VECTOR_INDEX_THRESHOLD', 'FIELD_RECALL_TOP_K', 'MAX_TABLES'];
        const vecItems = items.filter(s => vecKeys.includes(s.key));
        document.getElementById('vectorConfig').innerHTML = vecItems.map(s => renderSettingRow(s, {
            'VECTOR_INDEX_THRESHOLD': { desc: '字段数达到此值自动构建索引', width: '80px' },
            'FIELD_RECALL_TOP_K': { desc: '向量检索时召回的最大字段数', width: '80px' },
            'MAX_TABLES': { desc: '按表聚合时包含的最大表数', width: '80px' }
        })).join('');
    } catch (e) {
        document.getElementById('jwtSettings').textContent = '加载失败（仅管理员可查看）';
    }
}

function renderSettingRow(s, meta) {
    const m = (meta && meta[s.key]) || {};
    const desc = m.desc || '';
    const disabled = m.disabled || false;
    const width = m.width || '120px';
    return `
    <div class="setting-row">
        <div>
            <span class="setting-key">${s.key}</span>
            <br><span class="setting-desc">${desc}</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
            <input type="text" class="form-control form-control-sm2"
                   id="val-${s.key}" value="${escapeHtml(s.value)}"
                   style="width:${width};"
                   ${disabled ? 'disabled' : ''}>
            ${!disabled ? `<button class="btn btn-outline-primary btn-sm2" onclick="saveSetting('${s.key}')">保存</button>` : ''}
        </div>
    </div>`;
}

async function saveSetting(key) {
    const input = document.getElementById('val-' + key);
    try {
        const resp = await apiRequest('/api/system/settings', {
            method: 'PUT',
            body: JSON.stringify({ key, value: input.value })
        });
        const data = await resp.json();
        if (resp.ok) {
            showMsg(data.message + '（重启服务后生效）', 'success');
        } else {
            showMsg((await resp.json()).detail || '保存失败', 'danger');
        }
    } catch (e) {
        showMsg('保存失败: ' + e.message, 'danger');
    }
}

async function downloadEmbedding() {
    const btn = document.getElementById('btnDownload');
    btn.disabled = true; btn.textContent = '⏳ 正在启动下载...';
    try {
        const resp = await apiRequest('/api/system/download-embedding', { method: 'POST' });
        const data = await resp.json();
        showMsg(data.message, data.success ? 'info' : 'danger');
    } catch (e) {
        showMsg('下载失败: ' + e.message, 'danger');
    }
    btn.disabled = false; btn.textContent = '📥 下载 Embedding 模型';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

document.addEventListener('DOMContentLoaded', checkAll);
</script>
</body>
</html>
