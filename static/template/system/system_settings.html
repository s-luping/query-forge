<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <link rel="stylesheet" href="/static/css/system_settings.css">
</head>
<body>
<div class="container-fluid">

    <!-- 向量模型信息 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-brain me-2"></i>向量模型</div>
        <div class="card-body" id="embeddingInfo">
            <div class="setting-row">
                <span class="setting-key">EMBEDDING_MODEL_READY</span>
                <span class="setting-value">加载中...</span>
            </div>
            <div class="setting-row">
                <span class="setting-key">EMBEDDING_MODEL_PATH</span>
                <span class="setting-value">-</span>
            </div>
        </div>
    </div>

    <!-- JWT 配置 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-key me-2"></i>JWT 配置</div>
        <div class="card-body" id="jwtSettings">加载中...</div>
    </div>

    <!-- 向量索引参数 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-sliders-h me-2"></i>向量索引参数</div>
        <div class="card-body" id="vectorConfig">加载中...</div>
    </div>

    <!-- 站点品牌 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-palette me-2"></i>站点品牌</div>
        <div class="card-body" id="brandingConfig">加载中...</div>
        <div class="card-body pt-0 text-muted" style="font-size:12px;">
            自定义 Logo 支持任意可访问的图片地址（如 /static/img/logo.svg 或 http://.../logo.png），保存后登录页、首页、管理后台立即生效。
        </div>
    </div>

    <!-- 操作 -->
    <div class="card">
        <div class="card-header"><i class="fas fa-tools me-2"></i>操作</div>
        <div class="card-body">
            <div class="d-grid gap-2">
                <button class="btn btn-outline-primary" id="btnDownload" onclick="downloadEmbedding()">
                    📥 下载 Embedding 模型
                </button>
                <button class="btn btn-outline-secondary" onclick="checkAll()">
                    🔄 刷新状态
                </button>
            </div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="/static/css/all.min.css">
<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app_common.js"></script>
<script src="/static/js/system_settings.js"></script>
</body>
</html>
