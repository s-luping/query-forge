<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat SQL</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --input-height: 80px;
            --header-height: 48px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .chat-layout {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ──────────────────────────── */
        .chat-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: #2c2c2c;
            color: #ccc;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
        }

        .chat-sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .chat-sidebar-header button {
            width: 100%;
            padding: 8px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .chat-sidebar-header button:hover { background: #0b5ed7; }

        .chat-sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conv-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            transition: background 0.15s;
            position: relative;
        }
        .conv-item:hover { background: #3a3a3a; }
        .conv-item.active { background: #0d6efd; color: #fff; }

        .conv-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .conv-item-meta {
            font-size: 11px;
            opacity: 0.65;
            margin-top: 3px;
        }
        .conv-item-delete {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            cursor: pointer;
            color: #f88;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .conv-item:hover .conv-item-delete { opacity: 1; }
        .conv-item-delete:hover { background: rgba(255,0,0,0.2); }

        /* ── Main Chat Area ───────────────────── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 0;
        }

        .chat-header {
            height: var(--header-height);
            line-height: var(--header-height);
            padding: 0 20px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* ── Message Bubbles ──────────────────── */
        .msg-row {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .msg-row.user .msg-bubble {
            background: #0d6efd;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-row.assistant .msg-bubble {
            background: #f0f0f0;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .msg-sql-block {
            margin-top: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }

        .msg-sql-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        .msg-sql-actions button {
            font-size: 12px;
            padding: 3px 10px;
        }

        .msg-valid-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }
        .msg-valid-badge.ok { background: #d4edda; color: #155724; }
        .msg-valid-badge.err { background: #f8d7da; color: #721c24; }

        .msg-error {
            margin-top: 6px;
            font-size: 12px;
            color: #dc3545;
        }

        /* ── Input Area ───────────────────────── */
        .chat-input-area {
            border-top: 1px solid #e0e0e0;
            padding: 12px 20px;
            background: #fafafa;
            flex-shrink: 0;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input-row textarea {
            flex: 1;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.5;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }
        .chat-input-row textarea:focus { border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.15); }

        .chat-input-row button {
            padding: 10px 22px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chat-input-row button:hover { background: #0b5ed7; }
        .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-input-hint {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
        }

        /* ── New Conversation Modal ───────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-dialog-custom {
            background: #fff;
            border-radius: 10px;
            width: 480px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .modal-header-custom {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 16px;
        }
        .modal-body-custom {
            padding: 20px;
        }
        .modal-body-custom label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            display: block;
            color: #555;
        }
        .modal-body-custom select,
        .modal-body-custom textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            font-family: inherit;
        }
        .modal-body-custom select:focus,
        .modal-body-custom textarea:focus { border-color: #0d6efd; }
        .modal-body-custom textarea { min-height: 80px; resize: vertical; }

        .modal-footer-custom {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-footer-custom button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }

        /* ── Empty state ──────────────────────── */
        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 15px;
            text-align: center;
            flex-direction: column;
        }
        .chat-empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* ── Scrollbar ────────────────────────── */
        .chat-messages::-webkit-scrollbar,
        .chat-sidebar-list::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .chat-sidebar-list::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        /* ── Loading dots ─────────────────────── */
        .loading-dots {
            display: inline-flex; gap: 4px; padding: 4px 0;
        }
        .loading-dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: #999; animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="chat-layout">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-header">
            <button onclick="showNewConvModal()">+ 新建对话</button>
        </div>
        <div class="chat-sidebar-list" id="convList">
            <!-- filled by JS -->
        </div>
    </div>

    <!-- ── Main Chat ───────────────────────────────────── -->
    <div class="chat-main">
        <div class="chat-header" id="chatHeader">Chat SQL — 连续对话</div>

        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="chat-empty" id="chatEmpty">
            <div class="chat-empty-icon">💬</div>
            <div>选择或创建一个对话开始生成 SQL</div>
            <div style="font-size:12px;margin-top:6px;">支持多轮修改：生成 SQL 后可继续提出修改意见</div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display:none;">
            <div class="chat-input-row">
                <textarea id="msgInput" rows="1" placeholder="输入修改意见，如：表名改成 orders、加一个日期过滤..."
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
                <button id="sendBtn" onclick="sendMsg()">发送</button>
            </div>
            <div class="chat-input-hint">Enter 发送，Shift+Enter 换行</div>
        </div>
    </div>
</div>

<!-- ── New Conversation Modal ──────────────────────────── -->
<div class="modal-overlay" id="newConvModal">
    <div class="modal-dialog-custom">
        <div class="modal-header-custom">新建对话</div>
        <div class="modal-body-custom">
            <label>Schema（选择数据库）</label>
            <select id="newConvSchema">
                <option value="">全部 Schema</option>
            </select>

            <label>数据库类型</label>
            <select id="newConvDbType">
                <option value="sqlite">SQLite</option>
                <option value="mysql">MySQL</option>
                <option value="postgresql">PostgreSQL</option>
                <option value="oracle">Oracle</option>
                <option value="sqlserver">SQL Server</option>
            </select>

            <label>补充知识</label>
            <select id="newConvKnowledge">
                <option value="">不使用补充知识</option>
            </select>

            <label>LLM 模型</label>
            <select id="newConvLlmConfig">
                <option value="">使用默认模型</option>
            </select>

            <label>输入问题</label>
            <textarea id="newConvQuery" placeholder="描述你想要查询的数据..."></textarea>
        </div>
        <div class="modal-footer-custom">
            <button class="btn-secondary" onclick="hideNewConvModal()">取消</button>
            <button class="btn-primary" onclick="createConv()">开始对话</button>
        </div>
    </div>
</div>

<script>
// ── API helper ─────────────────────────────────────────────
function apiRequest(url, options = {}) {
    const token = document.cookie.split('; ').find(row => row.startsWith('token='))?.split('=')[1];
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    return fetch(url, { ...options, headers }).then(resp => {
        if (resp.status === 401) { window.parent.location.href = '/login'; throw new Error('登录已过期'); }
        return resp;
    });
}

// ── State ──────────────────────────────────────────────────
let currentConvId = null;
let isLoading = false;

// ── Init ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    loadConvList();
    loadSchemas();
    loadLlmConfigs();
    loadKnowledge();
});

// ── Conversation List ──────────────────────────────────────
async function loadConvList() {
    try {
        const resp = await apiRequest('/api/conversation');
        if (!resp.ok) return;
        const list = await resp.json();
        renderConvList(list);
    } catch (e) {
        console.error('加载对话列表失败:', e);
    }
}

function renderConvList(list) {
    const el = document.getElementById('convList');
    if (!list || list.length === 0) {
        el.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:13px;">暂无对话</div>';
        return;
    }
    el.innerHTML = list.map(c => `
        <div class="conv-item${c.id === currentConvId ? ' active' : ''}"
             onclick="openConv(${c.id})">
            <div class="conv-item-title">${escapeHtml(c.title || '(无标题)')}</div>
            <div class="conv-item-meta">${escapeHtml(c.schema_name || '默认')} · ${c.message_count} 条消息</div>
            <span class="conv-item-delete" onclick="event.stopPropagation();deleteConv(${c.id})" title="删除">×</span>
        </div>
    `).join('');
}

async function openConv(id) {
    currentConvId = id;
    loadConvList(); // refresh active state

    const emptyEl = document.getElementById('chatEmpty');
    if (emptyEl) emptyEl.style.display = 'none';
    document.getElementById('chatInputArea').style.display = 'block';

    const msgContainer = document.getElementById('chatMessages');
    msgContainer.innerHTML = '<div style="text-align:center;color:#aaa;padding:40px;">加载中...</div>';

    try {
        const resp = await apiRequest(`/api/conversation/${id}/messages`);
        if (!resp.ok) throw new Error('加载失败');
        const messages = await resp.json();

        // 获取标题
        const convResp = await apiRequest('/api/conversation');
        const convs = await convResp.json();
        const conv = convs.find(c => c.id === id);
        document.getElementById('chatHeader').textContent =
            (conv ? conv.title : 'Chat SQL') + ' — 连续对话';

        msgContainer.innerHTML = '';
        messages.forEach(m => renderMessage(m));
        scrollToBottom();
    } catch (e) {
        msgContainer.innerHTML = '<div style="text-align:center;color:red;padding:40px;">加载消息失败</div>';
    }
}

async function deleteConv(id) {
    if (!confirm('确定删除此对话？')) return;
    try {
        await apiRequest(`/api/conversation/${id}`, { method: 'DELETE' });
        if (currentConvId === id) {
            currentConvId = null;
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatEmpty').style.display = 'flex';
            document.getElementById('chatInputArea').style.display = 'none';
        }
        loadConvList();
    } catch (e) {
        alert('删除失败: ' + e.message);
    }
}

// ── Messages ───────────────────────────────────────────────
function renderMessage(msg) {
    const container = document.getElementById('chatMessages');

    if (msg.role === 'user') {
        const row = document.createElement('div');
        row.className = 'msg-row user';
        row.innerHTML = `<div class="msg-bubble">${escapeHtml(msg.content)}</div>`;
        container.appendChild(row);
    } else if (msg.role === 'assistant') {
        const row = document.createElement('div');
        row.className = 'msg-row assistant';
        let html = '<div class="msg-bubble">';

        if (msg.sql) {
            html += `<div class="msg-sql-block">${escapeHtml(msg.sql)}</div>`;
            html += `<div class="msg-sql-actions">`;
            html += `<button class="btn btn-sm btn-outline-secondary" onclick="copySql(this, '${escapeAttr(msg.sql)}')">📋 复制</button>`;
            html += `</div>`;
        }

        if (msg.is_valid) {
            html += `<span class="msg-valid-badge ok">✓ 校验通过</span>`;
        } else {
            html += `<span class="msg-valid-badge err">✗ 校验未通过</span>`;
            if (msg.error_message) {
                html += `<div class="msg-error">${escapeHtml(msg.error_message)}</div>`;
            }
        }

        html += '</div>';
        row.innerHTML = html;
        container.appendChild(row);
    }

    scrollToBottom();
}

function scrollToBottom() {
    const el = document.getElementById('chatMessages');
    setTimeout(() => { el.scrollTop = el.scrollHeight; }, 50);
}

// ── Send Message ───────────────────────────────────────────
async function sendMsg() {
    if (isLoading) return;

    const input = document.getElementById('msgInput');
    const content = input.value.trim();
    if (!content) return;

    if (!currentConvId) {
        alert('请先选择或创建一个对话');
        return;
    }

    isLoading = true;
    input.disabled = true;
    document.getElementById('sendBtn').disabled = true;

    // Show user message immediately
    renderMessage({ role: 'user', content: content });
    input.value = '';
    input.style.height = 'auto';

    // Show loading
    const container = document.getElementById('chatMessages');
    const loadingRow = document.createElement('div');
    loadingRow.className = 'msg-row assistant';
    loadingRow.id = 'loadingMsg';
    loadingRow.innerHTML = '<div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    container.appendChild(loadingRow);
    scrollToBottom();

    try {
        const resp = await apiRequest(`/api/conversation/${currentConvId}/messages`, {
            method: 'POST',
            body: JSON.stringify({ content })
        });
        if (!resp.ok) throw new Error((await resp.json()).detail || '请求失败');

        const data = await resp.json();

        // Remove loading
        document.getElementById('loadingMsg')?.remove();

        // Show assistant message
        renderMessage({
            role: 'assistant',
            sql: data.assistant_message.sql,
            is_valid: data.assistant_message.is_valid,
            error_message: data.assistant_message.error_message,
            columns: data.assistant_message.columns
        });

        loadConvList(); // refresh sidebar
    } catch (e) {
        document.getElementById('loadingMsg')?.remove();
        renderMessage({
            role: 'assistant',
            sql: '',
            is_valid: false,
            error_message: '发送失败: ' + e.message
        });
    }

    isLoading = false;
    input.disabled = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}

// ── New Conversation ───────────────────────────────────────
function showNewConvModal() {
    document.getElementById('newConvModal').classList.add('show');
    document.getElementById('newConvQuery').focus();
}

function hideNewConvModal() {
    document.getElementById('newConvModal').classList.remove('show');
}

async function createConv() {
    const query = document.getElementById('newConvQuery').value.trim();
    if (!query) { alert('请输入问题'); return; }

    const schemaName = document.getElementById('newConvSchema').value || null;
    const dbType = document.getElementById('newConvDbType').value;
    const llmConfigId = document.getElementById('newConvLlmConfig').value || null;
    const knowledgeId = document.getElementById('newConvKnowledge').value || null;

    hideNewConvModal();

    // Show loading
    const msgContainer = document.getElementById('chatMessages');
    msgContainer.innerHTML = '';
    const loadingRow = document.createElement('div');
    loadingRow.className = 'msg-row assistant';
    loadingRow.innerHTML = '<div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
    msgContainer.appendChild(loadingRow);
    const emptyEl = document.getElementById('chatEmpty');
    if (emptyEl) emptyEl.style.display = 'none';
    document.getElementById('chatInputArea').style.display = 'block';

    try {
        const resp = await apiRequest('/api/conversation', {
            method: 'POST',
            body: JSON.stringify({
                query, schema_name: schemaName, db_type: dbType,
                llm_config_id: llmConfigId ? parseInt(llmConfigId) : null,
                knowledge_id: knowledgeId ? parseInt(knowledgeId) : null
            })
        });
        if (!resp.ok) throw new Error((await resp.json()).detail || '创建失败');

        const data = await resp.json();

        // Remove loading
        msgContainer.innerHTML = '';

        // Open the new conversation
        currentConvId = data.conversation.id;
        document.getElementById('chatHeader').textContent =
            data.conversation.title + ' — 连续对话';

        // Render messages
        renderMessage({ role: 'user', content: query });
        renderMessage({
            role: 'assistant',
            sql: data.message.sql,
            is_valid: data.message.is_valid,
            error_message: data.message.error_message,
            columns: data.message.columns
        });

        document.getElementById('newConvQuery').value = '';
        loadConvList();
    } catch (e) {
        msgContainer.innerHTML = '';
        renderMessage({
            role: 'assistant',
            sql: '',
            is_valid: false,
            error_message: '创建对话失败: ' + e.message
        });
    }
}

// ── Schema & LLM Config Loaders ────────────────────────────
async function loadSchemas() {
    try {
        const resp = await apiRequest('/api/schema/schemas');
        if (!resp.ok) return;
        const data = await resp.json();
        const sel = document.getElementById('newConvSchema');
        (data.schemas || []).forEach(s => {
            const opt = document.createElement('option');
            opt.value = s;
            opt.textContent = s;
            sel.appendChild(opt);
        });
    } catch (e) { console.error('加载 Schema 失败:', e); }
}

async function loadLlmConfigs() {
    try {
        const resp = await apiRequest('/api/llm-config/list');
        if (!resp.ok) return;
        const data = await resp.json();
        const sel = document.getElementById('newConvLlmConfig');
        (data.items || []).forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = `${c.provider} - ${c.model}`;
            if (c.is_default) opt.selected = true;
            sel.appendChild(opt);
        });
    } catch (e) { console.error('加载 LLM 配置失败:', e); }
}

async function loadKnowledge() {
    try {
        const resp = await apiRequest('/api/extra-knowledge');
        if (!resp.ok) return;
        const data = await resp.json();
        const sel = document.getElementById('newConvKnowledge');
        (data.items || []).forEach(k => {
            const opt = document.createElement('option');
            opt.value = k.id;
            opt.textContent = k.title || '(无标题)';
            sel.appendChild(opt);
        });
    } catch (e) { console.error('加载补充知识失败:', e); }
}

// ── Utils ──────────────────────────────────────────────────
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function escapeAttr(text) {
    return text.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function copySql(btn, sql) {
    navigator.clipboard.writeText(sql).then(() => {
        btn.textContent = '✓ 已复制';
        setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
    }).catch(() => {
        alert('复制失败，请手动复制');
    });
}

// Close modal on click-outside
document.getElementById('newConvModal').addEventListener('click', function(e) {
    if (e.target === this) hideNewConvModal();
});
</script>
</body>
