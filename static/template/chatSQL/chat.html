<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat SQL</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --input-height: 80px;
            --header-height: 48px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }

        .chat-layout {
            display: flex;
            height: 100vh;
        }

        /* ── Sidebar ──────────────────────────── */
        .chat-sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: #2c2c2c;
            color: #ccc;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #444;
        }

        .chat-sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid #444;
            flex-shrink: 0;
        }

        .chat-sidebar-header button {
            width: 100%;
            padding: 8px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .chat-sidebar-header button:hover { background: #0b5ed7; }

        .chat-sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conv-item {
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            transition: background 0.15s;
            position: relative;
        }
        .conv-item:hover { background: #3a3a3a; }
        .conv-item.active { background: #0d6efd; color: #fff; }

        .conv-item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }
        .conv-item-meta {
            font-size: 11px;
            opacity: 0.65;
            margin-top: 3px;
        }
        .conv-item-delete {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0;
            cursor: pointer;
            color: #f88;
            font-size: 16px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .conv-item:hover .conv-item-delete { opacity: 1; }
        .conv-item-delete:hover { background: rgba(255,0,0,0.2); }

        /* ── Main Chat Area ───────────────────── */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            min-width: 0;
        }

        .chat-header {
            height: var(--header-height);
            line-height: var(--header-height);
            padding: 0 20px;
            font-weight: 600;
            font-size: 15px;
            border-bottom: 1px solid #e0e0e0;
            background: #fafafa;
            flex-shrink: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* ── Message Bubbles ──────────────────── */
        .msg-row {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.2s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }

        .msg-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .msg-row.user .msg-bubble {
            background: #0d6efd;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-row.assistant .msg-bubble {
            background: #f0f0f0;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .msg-sql-block {
            margin-top: 8px;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            position: relative;
        }

        .msg-sql-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        .msg-sql-actions button {
            font-size: 12px;
            padding: 3px 10px;
        }

        .msg-valid-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 6px;
        }
        .msg-valid-badge.ok { background: #d4edda; color: #155724; }
        .msg-valid-badge.err { background: #f8d7da; color: #721c24; }

        .msg-error {
            margin-top: 6px;
            font-size: 12px;
            color: #dc3545;
        }

        /* ── Input Area ───────────────────────── */
        .chat-input-area {
            border-top: 1px solid #e0e0e0;
            padding: 12px 20px;
            background: #fafafa;
            flex-shrink: 0;
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .chat-input-row textarea {
            flex: 1;
            resize: none;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.5;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            font-family: inherit;
        }
        .chat-input-row textarea:focus { border-color: #0d6efd; box-shadow: 0 0 0 2px rgba(13,110,253,0.15); }

        .chat-input-row button {
            padding: 10px 22px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .chat-input-row button:hover { background: #0b5ed7; }
        .chat-input-row button:disabled { opacity: 0.5; cursor: not-allowed; }

        .chat-input-hint {
            font-size: 11px;
            color: #999;
            margin-top: 6px;
        }

        /* ── New Conversation Modal ───────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-dialog-custom {
            background: #fff;
            border-radius: 10px;
            width: 480px;
            max-width: 90vw;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .modal-header-custom {
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            font-size: 16px;
        }
        .modal-body-custom {
            padding: 20px;
        }
        .modal-body-custom label {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            display: block;
            color: #555;
        }
        .modal-body-custom select,
        .modal-body-custom textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            font-family: inherit;
        }
        .modal-body-custom select:focus,
        .modal-body-custom textarea:focus { border-color: #0d6efd; }
        .modal-body-custom textarea { min-height: 80px; resize: vertical; }

        .newconv-error {
            background: #fff1f0;
            border: 1px solid #ffccc7;
            color: #cf1322;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .newconv-error.hide { display: none !important; }

        .modal-footer-custom button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .modal-footer-custom {
            padding: 12px 20px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .modal-footer-custom button {
            padding: 8px 18px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-primary { background: #0d6efd; color: #fff; }
        .btn-primary:hover { background: #0b5ed7; }
        .btn-secondary { background: #e9ecef; color: #333; }
        .btn-secondary:hover { background: #dee2e6; }

        /* ── Empty state ──────────────────────── */
        .chat-empty {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aaa;
            font-size: 15px;
            text-align: center;
            flex-direction: column;
        }
        .chat-empty-icon { font-size: 48px; margin-bottom: 12px; }

        /* ── Scrollbar ────────────────────────── */
        .chat-messages::-webkit-scrollbar,
        .chat-sidebar-list::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .chat-sidebar-list::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }

        /* ── Loading dots ─────────────────────── */
        .loading-dots {
            display: inline-flex; gap: 4px; padding: 4px 0;
        }
        .loading-dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: #999; animation: bounce 1.2s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="chat-layout">

    <!-- ── Sidebar ─────────────────────────────────────── -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-header">
            <button onclick="showNewConvModal()">+ 新建对话</button>
        </div>
        <div class="chat-sidebar-list" id="convList">
            <!-- filled by JS -->
        </div>
    </div>

    <!-- ── Main Chat ───────────────────────────────────── -->
    <div class="chat-main">
        <div class="chat-header" id="chatHeader">Chat SQL — 连续对话</div>

        <div class="chat-messages" id="chatMessages">
        </div>

        <div class="chat-empty" id="chatEmpty">
            <div class="chat-empty-icon">💬</div>
            <div>选择或创建一个对话开始生成 SQL</div>
            <div style="font-size:12px;margin-top:6px;">支持多轮修改：生成 SQL 后可继续提出修改意见</div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display:none;">
            <div class="chat-input-row">
                <textarea id="msgInput" rows="1" placeholder="输入修改意见，如：表名改成 orders、加一个日期过滤..."
                    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
                <button id="sendBtn" onclick="sendMsg()">发送</button>
            </div>
            <div class="chat-input-hint">Enter 发送，Shift+Enter 换行</div>
        </div>
    </div>
</div>

<!-- ── New Conversation Modal ──────────────────────────── -->
<div class="modal-overlay" id="newConvModal">
    <div class="modal-dialog-custom">
        <div class="modal-header-custom">新建对话</div>
        <div class="modal-body-custom">
            <div class="newconv-error" id="newConvError" style="display:none;"></div>

            <label>数据库 <small class="text-muted" style="font-weight:normal;">（数据库类型随所选库自动带出）</small></label>
            <select id="newConvSchema" onchange="onSchemaSelect()">
                <option value="">全部数据库</option>
            </select>

            <label>知识库</label>
            <select id="newConvKnowledge">
                <option value="">不使用知识库</option>
            </select>

            <label>LLM 模型</label>
            <select id="newConvLlmConfig">
                <option value="">使用默认模型</option>
            </select>

            <label>输入问题 <span style="color:#999;font-weight:normal;">（Enter 发送，Shift+Enter 换行）</span></label>
            <textarea id="newConvQuery" placeholder="描述你想要查询的数据..."></textarea>
        </div>
        <div class="modal-footer-custom">
            <button class="btn-secondary" onclick="hideNewConvModal()">取消</button>
            <button class="btn-primary" id="newConvSubmit" onclick="createConv()">开始对话</button>
        </div>
    </div>
</div>

<script src="/static/js/app_common.js"></script>
<script src="/static/js/chat.js"></script>
</body>
</html>
