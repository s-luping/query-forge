<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>修改密码</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/login.css">
    <style>
        .success-message {
            display: none;
            color: #4CAF50;
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>

<body class="tpl-login-root">
    <div class="login-container">
        <div class="login-title">修改密码</div>

        <div class="error-message" id="errorMsg"></div>
        <div class="success-message" id="successMsg"></div>

        <!-- 修改密码表单 -->
        <div id="changePasswordFormContainer" class="form-container active">
            <form id="changePasswordForm">
                <div class="form-group">
                    <label for="currentPassword">当前密码</label>
                    <input type="password" id="currentPassword" name="currentPassword" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" name="newPassword" required autocomplete="new-password" minlength="8">
                    <small style="color:#888;display:block;">至少8位，需含大小写字母+数字+特殊字符</small>
                </div>
                <div class="form-group">
                    <label for="confirmNewPassword">确认新密码</label>
                    <input type="password" id="confirmNewPassword" name="confirmNewPassword" required autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn">修改密码</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="/" style="color: #2980b9; text-decoration: none;">返回首页</a>
                </div>
            </form>
        </div>
    </div>
    <script src="/static/js/app_common.js"></script>
    <script>
        // 修改密码表单提交
        document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmNewPassword = document.getElementById('confirmNewPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // 前端验证（与后端强密码策略一致：>=8位，含大小写字母+数字+特殊字符）
            if (newPassword.length < 8) {
                errorMsg.textContent = '新密码至少需要8个字符，且须包含大小写字母、数字和特殊字符';
                errorMsg.style.display = 'block';
                return;
            }

            if (newPassword !== confirmNewPassword) {
                errorMsg.textContent = '两次输入的新密码不一致';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('/api/user/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    successMsg.textContent = '密码修改成功！请重新登录';
                    successMsg.style.display = 'block';
                    // 清空表单
                    document.getElementById('changePasswordForm').reset();
                    // 2秒后跳转到登录页面
                    setTimeout(() => {
                        window.location.href = '/logout';
                    }, 2000);
                } else {
                    errorMsg.textContent = data.detail || '修改密码失败，请稍后重试';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请稍后重试';
                errorMsg.style.display = 'block';
            }
        });

        // 辅助函数：从cookie中获取指定名称的值
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
</body>

</html>
