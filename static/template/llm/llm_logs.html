<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 调用记录</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .stats-item {
            text-align: center;
            padding: 10px;
        }

        .stats-value {
            font-size: 28px;
            font-weight: bold;
        }

        .stats-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .card-header {
            background: white;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            padding: 15px 20px;
            border-radius: 12px 12px 0 0 !important;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            border-bottom: 2px solid #dee2e6;
            white-space: nowrap;
        }

        .table td {
            vertical-align: middle;
        }

        .status-success {
            color: #28a745;
        }

        .status-warning {
            color: #ffc107;
        }

        .status-error {
            color: #dc3545;
        }

        .question-cell {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .question-cell:hover {
            white-space: normal;
            overflow: visible;
        }

        .model-cell {
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .model-cell:hover {
            white-space: normal;
            overflow: visible;
        }

        .condition-cell {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .condition-cell:hover {
            white-space: normal;
            overflow: visible;
        }

        .result-cell {
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
            font-size: 12px;
        }

        .result-cell:hover {
            white-space: pre-wrap;
            overflow: visible;
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 12px;
        }

        .pagination-info {
            color: #666;
            font-size: 13px;
        }

        .detail-modal .modal-body {
            max-height: 60vh;
            overflow-y: auto;
        }

        .detail-item {
            margin-bottom: 15px;
        }

        .detail-label {
            font-weight: 600;
            color: #666;
            margin-bottom: 5px;
        }

        .detail-value {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            word-break: break-all;
        }

        .detail-value.sql {
            font-family: monospace;
            white-space: pre-wrap;
        }

        .filter-bar {
            margin-bottom: 15px;
        }

        .filter-bar .form-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 2px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="stats-card">
            <div class="row">
                <div class="col stats-item">
                    <div class="stats-value" id="totalCalls">0</div>
                    <div class="stats-label">总调用次数</div>
                </div>
                <div class="col stats-item">
                    <div class="stats-value" id="totalTokens">0</div>
                    <div class="stats-label">总Token消耗</div>
                </div>
                <div class="col stats-item">
                    <div class="stats-value" id="promptTokens">0</div>
                    <div class="stats-label">输入Token</div>
                </div>
                <div class="col stats-item">
                    <div class="stats-value" id="completionTokens">0</div>
                    <div class="stats-label">输出Token</div>
                </div>
                <div class="col stats-item">
                    <div class="stats-value" id="avgDuration">0</div>
                    <div class="stats-label">平均耗时(ms)</div>
                </div>
                <div class="col stats-item">
                    <div class="stats-value" id="successRate">0%</div>
                    <div class="stats-label">成功率</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>LLM 调用记录</span>
            </div>
            <div class="card-body">
                <div class="filter-bar row g-2 align-items-end">
                    <div class="col-auto">
                        <label class="form-label" for="dateFilter">日期</label>
                        <select id="dateFilter" class="form-select form-select-sm">
                            <option value="">全部</option>
                            <option value="1">今天</option>
                            <option value="7">近一周</option>
                            <option value="30">近30天</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="statusFilter">状态</label>
                        <select id="statusFilter" class="form-select form-select-sm">
                            <option value="">全部</option>
                            <option value="success">成功</option>
                            <option value="warning">警告</option>
                            <option value="error">错误</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="providerFilter">供应商</label>
                        <select id="providerFilter" class="form-select form-select-sm" style="max-width: 140px;">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="modelFilter">模型</label>
                        <select id="modelFilter" class="form-select form-select-sm" style="max-width: 220px;">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="durationFilter">耗时</label>
                        <select id="durationFilter" class="form-select form-select-sm">
                            <option value="">全部</option>
                            <option value="1000">&gt; 1s</option>
                            <option value="5000">&gt; 5s</option>
                            <option value="10000">&gt; 10s</option>
                            <option value="30000">&gt; 30s</option>
                            <option value="60000">&gt; 60s</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <label class="form-label" for="tokenFilter">Token</label>
                        <select id="tokenFilter" class="form-select form-select-sm">
                            <option value="">全部</option>
                            <option value="1000">&ge; 1k</option>
                            <option value="10000">&ge; 1w</option>
                            <option value="50000">&ge; 5w</option>
                            <option value="100000">&ge; 10w</option>
                        </select>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="resetFilters" title="重置筛选">
                            <i class="fas fa-rotate-left"></i> 重置
                        </button>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>来源</th>
                                <th>供应商</th>
                                <th>问题</th>
                                <th>模型</th>
                                <th>结果</th>
                                <th>耗时(ms)</th>
                                <th>Token<br><small class="text-muted fw-normal">to/in/out</small></th>
                                <th>状态</th>
                                <th>时间</th>
                                <th data-admin-only>操作</th>
                            </tr>
                        </thead>
                        <tbody id="logsTable">
                            <tr>
                                <td colspan="11" class="text-center text-muted py-4">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <div class="pagination-info">
                        共 <span id="totalCount">0</span> 条记录
                    </div>
                    <nav>
                        <ul class="pagination pagination-sm mb-0" id="pagination">
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade detail-modal" id="detailModal" tabindex="-1" inert>
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">调用详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="detailContent">
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="/static/css/all.min.css">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app_common.js"></script>
<script src="/static/js/llm_logs.js"></script>
</body>

</html>
