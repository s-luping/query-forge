<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM 模型配置</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        .container-fluid {
            max-width: 900px;
        }

        .config-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .config-item.default {
            border-left: 3px solid #28a745;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .btn-test {
            min-width: 100px;
        }

        .form-label {
            font-weight: 500;
        }

        .api-key-input {
            font-family: monospace;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="fas fa-cog me-2"></i>添加/编辑配置</span>
                <button class="btn btn-outline-secondary btn-sm" onclick="resetForm()">
                    <i class="fas fa-redo me-1"></i>重置
                </button>
            </div>
            <div class="card-body">
                <form id="configForm">
                    <input type="hidden" id="configId">

                    <div class="mb-3">
                        <label class="form-label">模型供应商 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="providerInput"
                               placeholder="输入供应商名称，如 OpenAI、DeepSeek、智谱AI 等" required>
                        <small class="text-muted">自由输入模型供应商名称</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">模型名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="modelInput"
                               placeholder="输入模型名称，如 gpt-4、deepseek-chat、glm-4 等" required>
                        <small class="text-muted">输入完整的模型名称</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">API 密钥</label>
                        <div class="input-group">
                            <input type="password" class="form-control api-key-input" id="apiKey"
                                   placeholder="请输入API密钥">
                            <button class="btn btn-outline-secondary" type="button" onclick="toggleApiKey()">
                                <i class="fas fa-eye" id="apiKeyToggleIcon"></i>
                            </button>
                        </div>
                        <small class="text-muted" id="apiKeyHint">新建配置时必填，编辑时留空则保持原值</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">API 地址 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="baseUrl"
                               placeholder="填写API地址，如 https://api.openai.com/v1/chat/completions" required>
                        <small class="text-muted">OpenAI兼容的API端点地址</small>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Max Tokens</label>
                            <input type="number" class="form-control" id="maxTokens"
                                   value="8192" min="100" max="128000">
                            <small class="text-muted">最大生成token数</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Temperature</label>
                            <input type="number" class="form-control" id="temperature"
                                   value="0.0" min="0" max="2" step="0.1">
                            <small class="text-muted">生成随机性 (0-2)</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Timeout (秒)</label>
                            <input type="number" class="form-control" id="timeout"
                                   value="300" min="30" max="600">
                            <small class="text-muted">请求超时时间</small>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">思考模式</label>
                        <select class="form-select" id="thinkingMode">
                            <option value="auto" selected>跟随模型默认</option>
                            <option value="enabled">强制开启思考</option>
                            <option value="disabled">关闭思考</option>
                        </select>
                        <small class="text-muted">思考模型的思考Token计入输出上限，开启后建议同步调大 Max Tokens</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea class="form-control" id="description" rows="2"
                                  placeholder="可选备注信息"></textarea>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isDefault">
                        <label class="form-check-label" for="isDefault">设为默认模型</label>
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="isPublic">
                        <label class="form-check-label" for="isPublic">公开（所有用户可见和使用）</label>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary btn-test" onclick="testConnection()">
                            <i class="fas fa-plug me-1"></i>测试连接
                        </button>
                        <button type="submit" class="btn btn-primary flex-grow-1">
                            <i class="fas fa-save me-1"></i>保存配置
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <i class="fas fa-list me-2"></i>已保存的配置
            </div>
            <div class="card-body" id="configList">
                <div class="text-center text-muted py-4">暂无配置</div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="/static/css/all.min.css">
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app_common.js"></script>
<script src="/static/js/llm_config.js"></script>
</body>

</html>
