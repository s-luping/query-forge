<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body class="tpl-index-root" style="overflow:hidden;">
    <div class="tpl-index-layout">
        <!-- 左侧菜单栏 -->
        <div id="sidebar" class="tpl-index-sidebar">
            <div class="tpl-index-sidebar-title"><img src="/static/img/logo.svg" width="22" height="22" alt="" style="vertical-align:-4px;margin-right:6px;" data-brand-logo><span data-brand-name>QueryForge</span></div>
            <a href="/" class="tpl-index-sidebar-back">← 返回首页</a>
            <div class="tpl-index-sidebar-content">
                <!-- 管理功能（仅管理员，/admin 由后端守卫） -->
                <div class="menu-group">
                    <div class="menu-group-title" onclick="toggleMenu('schema')">数据管理</div>
                    <div id="menu-schema" class="menu-items" style="display:none;">
                        <div class="menu-item" onclick="openWindow('数据浏览','/static/template/schema/schema_view.html')">数据浏览</div>
                        <div class="menu-item" onclick="openWindow('向量索引','/static/template/schema/vector_index.html')">向量索引</div>
                        <div class="menu-item" onclick="openWindow('数据源管理','/static/template/system/sync_manage.html#datasources')">数据源管理</div>
                        <div class="menu-item" onclick="openWindow('同步任务','/static/template/system/sync_manage.html#jobs')">同步任务</div>
                        <div class="menu-item" onclick="openWindow('同步历史','/static/template/system/sync_manage.html#runs')">同步历史</div>
                        <div class="menu-item" onclick="openWindow('变更记录','/static/template/system/sync_manage.html#changes')">变更记录</div>
                    </div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title" onclick="toggleMenu('llm')">模型管理</div>
                    <div id="menu-llm" class="menu-items" style="display:none;">
                        <div class="menu-item" onclick="openWindow('模型配置','/static/template/llm/llm_config.html')">模型配置</div>
                        <div class="menu-item" onclick="openWindow('调用日志','/static/template/llm/llm_logs.html')">调用日志</div>
                    </div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title" onclick="toggleMenu('system')">系统管理</div>
                    <div id="menu-system" class="menu-items" style="display:none;">
                        <div class="menu-item" onclick="openWindow('用户管理','/static/template/system/user_manage.html')">用户管理</div>
                        <div class="menu-item" onclick="openWindow('驱动管理','/static/template/system/driver_manage.html')">驱动管理</div>
                        <div class="menu-item" onclick="openWindow('权限管理','/static/template/system/permission_manage.html')">权限管理</div>
                        <div class="menu-item" onclick="openWindow('系统设置','/static/template/system/system_settings.html')">系统设置</div>
                        <div class="menu-item" onclick="openWindow('接口文档','/docs')">接口文档</div>
                    </div>
                </div>
                <div class="menu-group">
                    <div class="menu-group-title" onclick="toggleMenu('security')">安全中心</div>
                    <div id="menu-security" class="menu-items" style="display:none;">
                        <div class="menu-item" onclick="openWindow('审计概览','/static/template/system/security_manage.html#overview')">审计概览</div>
                        <div class="menu-item" onclick="openWindow('审计日志','/static/template/system/security_manage.html#logs')">审计日志</div>
                        <div class="menu-item" onclick="openWindow('敏感字段','/static/template/system/security_manage.html#sensitive')">敏感字段</div>
                        <div class="menu-item" onclick="openWindow('行级规则','/static/template/system/security_manage.html#rowscope')">行级规则</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 右侧内容区 -->
        <div id="window-container" class="tpl-index-window-container">
            <div id="tab-bar" class="tpl-index-tab-bar"></div>
            <div id="tab-content" class="tpl-index-tab-content"></div>
        </div>
    </div>
    <!-- 顶部栏，右上角显示用户名 -->
    <div id="topbar" class="tpl-index-topbar">
        <span class="tpl-index-topbar-title"><img src="/static/img/logo.svg" width="20" height="20" alt="" style="vertical-align:-4px;margin-right:6px;" data-brand-logo>QueryForge 智能数据查询平台 <span
                class="tpl-index-topbar-version">v1.0</span></span>
        <div class="dropdown tpl-index-user-dropdown">
            <span id="user-info" class="tpl-index-user-info"></span>
            <a id="login-link" href="/login" class="tpl-index-login-link"
                style="display:none;color:#fff;text-decoration:none;">登录</a>
            <div id="user-dropdown" class="tpl-index-user-dropdown-menu">
                <a href="/static/template/change_password.html" class="tpl-index-logout-link">修改密码</a>
                <a href="/logout" class="tpl-index-logout-link">退出登录</a>
            </div>
        </div>
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/branding.js"></script>
    <script>
        // 全局 API 请求封装 — 子页面通过 window.apiRequest 调用
        window.apiRequest = async function (url, options = {}) {
            const token = getCookie('token');
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const resp = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
            if (resp.status === 401) {
                const data = await resp.json().catch(() => ({}));
                const msg = data.detail || '登录已过期，请重新登录';
                if (confirm(msg + '\n\n点击确定前往登录页面')) {
                    window.location.href = '/login';
                }
                throw new Error(msg);
            }
            return resp;
        };

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        // 从服务端获取当前用户（token 为 HttpOnly cookie，JS 无法读取，必须走后端接口）
        async function loadCurrentUser() {
            try {
                const resp = await fetch('/api/user/profile', { credentials: 'same-origin' });
                if (!resp.ok) return null;
                return await resp.json();
            } catch (e) { return null; }
        }

        // 检查 embedding 模型下载状态
        async function checkEmbeddingStatus() {
            try {
                const resp = await window.apiRequest('/api/system/embedding-status');
                const data = await resp.json();
                if (!data.downloaded) {
                    showEmbeddingBanner();
                }
            } catch (e) { /* 静默失败 */ }
        }

        function showEmbeddingBanner() {
            const banner = document.createElement('div');
            banner.id = 'embedding-banner';
            banner.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;'
                + 'background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:8px;'
                + 'padding:12px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 16px rgba(0,0,0,0.15);';
            banner.innerHTML = `
                <span>⚠️ Embedding 模型未下载，向量搜索功能不可用</span>
                <button id="btn-download-embedding" style="background:#0d6efd;color:#fff;border:none;
                    border-radius:4px;padding:6px 16px;cursor:pointer;white-space:nowrap;">
                    📥 下载模型
                </button>
                <button onclick="this.parentElement.remove()" style="background:none;border:none;
                    font-size:18px;cursor:pointer;color:#856404;">×</button>
            `;
            document.body.appendChild(banner);
            document.getElementById('btn-download-embedding').addEventListener('click', async function () {
                this.textContent = '下载中...';
                this.disabled = true;
                try {
                    const resp = await window.apiRequest('/api/system/download-embedding', { method: 'POST' });
                    const data = await resp.json();
                    alert(data.message);
                } catch (e) {
                    alert('启动下载失败: ' + e.message);
                }
                this.textContent = '📥 下载模型';
                this.disabled = false;
            });
        }
        window.addEventListener('DOMContentLoaded', async function () {
            const userInfo = document.getElementById('user-info');
            const loginLink = document.getElementById('login-link');
            const userDropdown = document.getElementById('user-dropdown');
            // token 为 HttpOnly cookie，前端无法解码，统一走后端接口获取当前用户
            const user = await loadCurrentUser();
            if (user && user.username) {
                userInfo.textContent = user.username;
                userInfo.style.display = '';
                loginLink.style.display = 'none';
                // 管理后台仅管理员可访问（后端 /admin 守卫兜底）
                if (user.role !== 'admin') {
                    window.location.href = '/';
                }
                checkEmbeddingStatus();

                // 下拉菜单由 CSS 悬停驱动（.tpl-index-user-dropdown:hover，含悬停桥），
                // 鼠标从用户名移入菜单不会消失；点击退出登录直接走 /logout
                const logoutLink = userDropdown.querySelector('a[href="/logout"]');
                if (logoutLink) {
                    logoutLink.addEventListener('click', function (e) {
                        e.preventDefault();
                        // token 为 HttpOnly cookie，前端无法清除，交由服务端 /logout 处理
                        window.location.href = '/logout';
                    });
                }
            } else {
                // 未登录：后端 / 与模板守卫也会拦截，这里前端兜底跳转登录页
                userInfo.style.display = 'none';
                loginLink.style.display = '';
                userDropdown.style.display = 'none';
                window.location.href = '/login';
            }
        });

        function toggleMenu(type) {
            const el = document.getElementById('menu-' + type);
            const isOpen = el.style.display === 'none';
            el.style.display = isOpen ? '' : 'none';
            // 组标题箭头旋转状态
            document.querySelectorAll('.menu-group-title').forEach(t => {
                if (t.getAttribute('onclick') === `toggleMenu('${type}')`) {
                    t.classList.toggle('open', isOpen);
                }
            });
        }

        const tabList = [];
        function openWindow(title, url) {
            // 菜单选中高亮：按 onclick 中的 url 匹配当前菜单项
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            const matched = document.querySelector(`.menu-item[onclick*="${url}"]`);
            if (matched) matched.classList.add('active');
            let tabIdx = tabList.findIndex(t => t.url === url);
            if (tabIdx === -1) {
                const tabId = 'tab-' + Date.now();
                tabList.push({ id: tabId, title, url });
                renderTabs(tabId);
            } else {
                renderTabs(tabList[tabIdx].id);
            }
        }
        function renderTabs(activeId) {
            const tabBar = document.getElementById('tab-bar');
            const tabContent = document.getElementById('tab-content');
            tabBar.innerHTML = '';
            tabContent.innerHTML = '';
            tabList.forEach(tab => {
                const tabDiv = document.createElement('div');
                tabDiv.className = 'tab' + (tab.id === activeId ? ' active' : '');
                tabDiv.innerHTML = `<span>${tab.title}</span><span class='tab-close' onclick='closeTab("${tab.id}",event)'>×</span>`;
                tabDiv.onclick = function (e) {
                    if (e.target.classList.contains('tab-close')) return;
                    renderTabs(tab.id);
                };
                tabBar.appendChild(tabDiv);
                const iframe = document.createElement('iframe');
                iframe.className = 'tab-iframe' + (tab.id === activeId ? ' active' : '');
                iframe.src = tab.url;
                iframe.id = 'iframe-' + tab.id;
                tabContent.appendChild(iframe);
            });
        }
        function closeTab(tabId, evt) {
            evt.stopPropagation();
            const idx = tabList.findIndex(t => t.id === tabId);
            if (idx !== -1) {
                const wasActive = document.querySelector('.tab.active') && tabList[idx].id === tabList.find(t => document.querySelector('.tab.active').textContent.trim().startsWith(t.title)).id;
                tabList.splice(idx, 1);
                if (tabList.length > 0) {
                    const newIdx = idx > 0 ? idx - 1 : 0;
                    renderTabs(tabList[newIdx].id);
                } else {
                    renderTabs(null);
                }
            }
        }

        let dragData = null;
        function dragWindow(e, id) {
            const win = document.getElementById(id);
            dragData = {
                win: win,
                offsetX: e.clientX - win.offsetLeft,
                offsetY: e.clientY - win.offsetTop
            };
            document.onmousemove = moveWindow;
            document.onmouseup = function () { dragData = null; document.onmousemove = null; };
        }
        function moveWindow(e) {
            if (!dragData) return;
            dragData.win.style.left = (e.clientX - dragData.offsetX) + 'px';
            dragData.win.style.top = (e.clientY - dragData.offsetY) + 'px';
        }
    </script>

</html>
