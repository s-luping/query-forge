<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <style>
        body { background: #f5f5f5; font-size: 14px; }
        .page-header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .page-header h5 { margin: 0; font-weight: 600; }
        .page-body { padding: 20px 24px; max-width: 1200px; }
        .card-custom { background: #fff; border-radius: 8px; border: 1px solid #e5e5e5; margin-bottom: 16px; }
        .card-custom .card-body { padding: 16px 20px; }
        .card-custom .card-header-custom { padding: 12px 20px; background: #fafafa; border-bottom: 1px solid #e5e5e5; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .knowledge-item { cursor: pointer; transition: background 0.15s; border-bottom: 1px solid #f0f0f0; }
        .knowledge-item:hover { background: #f8f9fa; }
        .knowledge-item:last-child { border-bottom: none; }
        .knowledge-item .title { font-weight: 500; color: #333; }
        .knowledge-item .meta { font-size: 12px; color: #999; margin-top: 2px; }
        .knowledge-item .preview { font-size: 12px; color: #666; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
        textarea.form-control { min-height: 100px; }
    </style>
</head>
<body>

<div class="page-header">
    <h5>知识库管理</h5>
    <button class="btn btn-primary btn-sm" onclick="showCreateForm()">+ 新建知识</button>
</div>

<div class="page-body">
    <!-- List -->
    <div id="listSection">
        <div id="knowledgeLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">加载中...</p>
        </div>
        <div id="knowledgeContent" class="d-none">
            <div class="card-custom">
                <div class="card-body p-0" id="knowledgeList"></div>
            </div>
            <div id="knowledgePagination" class="d-flex justify-content-between align-items-center mt-3">
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPage(currentPage - 1)" id="prevBtn">上一页</button>
                <span class="text-muted" id="pageInfo">第 1 页，共 1 页</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadPage(currentPage + 1)" id="nextBtn">下一页</button>
            </div>
        </div>
        <div id="knowledgeEmpty" class="d-none">
            <div class="empty-state">
                <div class="icon">📖</div>
                <p>暂无知识</p>
                <button class="btn btn-primary btn-sm" onclick="showCreateForm()">添加第一条知识</button>
            </div>
        </div>
    </div>

    <!-- Form -->
    <div id="formSection" class="d-none">
        <div class="card-custom">
            <div class="card-header-custom">
                <span id="formTitle">新建知识</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="showList()">← 返回列表</button>
            </div>
            <div class="card-body">
                <form id="knowledgeForm" onsubmit="saveKnowledge(event)">
                    <input type="hidden" id="knowledgeId">
                    <div class="mb-3">
                        <label class="form-label fw-bold">标题</label>
                        <input type="text" class="form-control" id="knowledgeTitle" placeholder="例如：订单状态说明、表间关系">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">知识内容</label>
                        <textarea class="form-control" id="knowledgeContent2" rows="8"
                            placeholder="输入领域知识，如：&#10;1. order_status 字段取值：pending=待处理, processing=处理中, completed=已完成&#10;2. orders 表与 order_items 表通过 order_id 关联&#10;3. 退款金额 = 已支付金额 - 已发货金额"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">状态</label>
                        <select class="form-select" id="knowledgeActive" style="width:200px;">
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-outline-secondary ms-2" onclick="showList()">取消</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/app_common.js"></script>
<script>
let currentPage = 1;
const pageSize = 10;

document.addEventListener('DOMContentLoaded', () => loadList(1));

async function loadList(page) {
    currentPage = page;
    document.getElementById('knowledgeLoading').classList.remove('d-none');
    document.getElementById('knowledgeContent').classList.add('d-none');
    document.getElementById('knowledgeEmpty').classList.add('d-none');
    document.getElementById('formSection').classList.add('d-none');
    document.getElementById('listSection').classList.remove('d-none');

    try {
        const resp = await apiRequest(`/api/knowledge?limit=${pageSize}&offset=${(page-1)*pageSize}`);
        if (!resp.ok) throw new Error('加载失败');
        const data = await resp.json();
        const items = data.items || [];

        document.getElementById('knowledgeLoading').classList.add('d-none');

        if (items.length === 0 && page === 1) {
            document.getElementById('knowledgeEmpty').classList.remove('d-none');
        } else {
            document.getElementById('knowledgeContent').classList.remove('d-none');
            renderList(items);
            document.getElementById('prevBtn').disabled = page <= 1;
            document.getElementById('nextBtn').disabled = items.length < pageSize;
            document.getElementById('pageInfo').textContent = `第 ${page} 页`;
        }
    } catch (e) {
        document.getElementById('knowledgeLoading').classList.add('d-none');
        alert('加载失败: ' + e.message);
    }
}

function renderList(items) {
    const el = document.getElementById('knowledgeList');
    el.innerHTML = items.map(k => `
        <div class="knowledge-item p-3" onclick="editKnowledge(${k.id})">
            <div class="d-flex justify-content-between align-items-start">
                <div class="flex-grow-1" style="min-width:0;">
                    <div class="title">${escapeHtml(k.title || '(无标题)')}</div>
                    <div class="preview">${escapeHtml((k.content || '').substring(0, 120))}</div>
                    <div class="meta">
                        创建: ${k.created_at ? k.created_at.substring(0,10) : '-'}
                        · 更新: ${k.updated_at ? k.updated_at.substring(0,10) : '-'}
                    </div>
                </div>
                <div class="ms-3 text-end flex-shrink-0">
                    <span class="badge ${k.is_active ? 'badge-active' : 'badge-inactive'}">${k.is_active ? '启用' : '禁用'}</span>
                    <button class="btn btn-sm btn-outline-danger ms-2" onclick="event.stopPropagation();deleteKnowledge(${k.id})">删除</button>
                </div>
            </div>
        </div>
    `).join('');
}

function showCreateForm() {
    document.getElementById('knowledgeId').value = '';
    document.getElementById('knowledgeTitle').value = '';
    document.getElementById('knowledgeContent2').value = '';
    document.getElementById('knowledgeActive').value = '1';
    document.getElementById('formTitle').textContent = '新建知识';
    document.getElementById('listSection').classList.add('d-none');
    document.getElementById('formSection').classList.remove('d-none');
}

async function editKnowledge(id) {
    document.getElementById('knowledgeLoading').classList.remove('d-none');
    document.getElementById('listSection').classList.add('d-none');
    try {
        const resp = await apiRequest(`/api/knowledge/${id}`);
        if (!resp.ok) throw new Error('加载失败');
        const k = await resp.json();
        document.getElementById('knowledgeId').value = k.id;
        document.getElementById('knowledgeTitle').value = k.title || '';
        document.getElementById('knowledgeContent2').value = k.content || '';
        document.getElementById('knowledgeActive').value = k.is_active ? '1' : '0';
        document.getElementById('formTitle').textContent = '编辑知识';
        document.getElementById('knowledgeLoading').classList.add('d-none');
        document.getElementById('formSection').classList.remove('d-none');
    } catch (e) {
        document.getElementById('knowledgeLoading').classList.add('d-none');
        showList();
        alert('加载失败: ' + e.message);
    }
}

function showList() {
    document.getElementById('formSection').classList.add('d-none');
    document.getElementById('listSection').classList.remove('d-none');
    loadList(currentPage);
}

async function saveKnowledge(event) {
    event.preventDefault();
    const id = document.getElementById('knowledgeId').value;
    const title = document.getElementById('knowledgeTitle').value.trim();
    const content = document.getElementById('knowledgeContent2').value.trim();
    const isActive = parseInt(document.getElementById('knowledgeActive').value);

    const body = { title, content, is_active: isActive };
    try {
        let resp;
        if (id) {
            resp = await apiRequest(`/api/knowledge/${id}`, { method: 'PUT', body: JSON.stringify(body) });
        } else {
            resp = await apiRequest('/api/knowledge', { method: 'POST', body: JSON.stringify(body) });
        }
        if (!resp.ok) throw new Error((await resp.json()).detail || '保存失败');
        alert(id ? '更新成功' : '创建成功');
        showList();
    } catch (e) {
        alert('保存失败: ' + e.message);
    }
}

async function deleteKnowledge(id) {
    if (!confirm('确定删除此知识？')) return;
    try {
        const resp = await apiRequest(`/api/knowledge/${id}`, { method: 'DELETE' });
        if (!resp.ok) throw new Error('删除失败');
        loadList(currentPage);
    } catch (e) {
        alert('删除失败: ' + e.message);
    }
}

// escapeHtml 由 app_common.js 提供

function loadPage(page) { loadList(page); }
</script>
</body>
</html>
